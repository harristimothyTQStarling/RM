  }catch(e){ status("Map failed"); toast("Map failed: "+(e&&e.message?e.message:e)); }
}
/* ============== TRANSFER HOURS (any resource × project pair) ============== */
/* Move all or part of a pair's open-month forecast to another person or TBA
   pool. Amounts default to everything — edit them (or use All/Half/None) for a
   partial transfer. Used from both Allocate tabs and the TBA tab. */
function openTransferModal(fromId, projid, presetDest){
  const src=personById(fromId); const pr=projById(projid);
  const monthsAvail=MONTHS.filter(m=>!isPastMi(m.mi))
    .map(m=>({key:m.key,label:m.label,avail:(state.alloc[fromId]&&state.alloc[fromId][projid]&&state.alloc[fromId][projid][m.key])||0}))
    .filter(x=>x.avail>0);
  if(!monthsAvail.length){ toast("No transferable hours — only open months with forecast can move."); return; }
  const destOpts=allPeople().filter(p=>String(p.id)!==String(fromId))
    .sort((a,b)=>((a.type==="tbh")-(b.type==="tbh")) || DEPTS.indexOf(a.dept)-DEPTS.indexOf(b.dept) || a.name.localeCompare(b.name))
    .map(p=>`<option value="${p.id}"${String(presetDest||"")===String(p.id)?" selected":""}>${esc(p.name)}${p.type==="tbh"?" (TBA)":""} · ${esc(p.role||deptLabel(p.dept))}</option>`).join("");
  const rows=monthsAvail.map(x=>`<tr><td class="src">${x.label}</td><td class="hrs">${fmt(x.avail)}h</td>`+
    `<td><input type="number" min="0" max="${x.avail}" step="0.5" value="${x.avail}" data-tramt="${x.key}" style="width:90px"></td></tr>`).join("");
  document.getElementById("modalRoot").innerHTML=`<div class="backdrop" id="trBackdrop"><div class="modal" style="width:min(560px,100%)" role="dialog" aria-modal="true">
    <div class="modal-hd"><h2>Transfer hours</h2>
      <p><b>${esc(src?src.name:String(fromId))}</b> · ${pr?esc(projLabel(pr)):esc(String(projid))} — move all or part of the open-month forecast to another person or TBA pool.</p></div>
    <div class="modal-bd">
      <div class="field"><label>Transfer to</label><select id="trDest">${destOpts}</select></div>
      <div class="scrollbox"><table class="maptbl"><thead><tr><th>Month</th><th>Available</th><th>Transfer</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="display:flex;gap:8px"><button class="btn" id="trAll" style="font-size:11px;padding:3px 9px">All</button>
        <button class="btn" id="trHalf" style="font-size:11px;padding:3px 9px">Half</button>
        <button class="btn" id="trNone" style="font-size:11px;padding:3px 9px">None</button></div>
    </div>
    <div class="modal-ft"><span class="muted" style="font-size:12px">Destination cells add on top of what's already there; the bill rate copies where the destination has none. Audited.</span>
      <span style="display:flex;gap:8px"><button class="btn" id="trCancel">Cancel</button><button class="btn primary" id="trApply">Transfer</button></span></div>
  </div></div>`;
  const setAll=f=>document.querySelectorAll("[data-tramt]").forEach(i=>{ const mx=Number(i.max); i.value=Math.round(mx*f*100)/100; });
  document.getElementById("trAll").addEventListener("click",()=>setAll(1));
  document.getElementById("trHalf").addEventListener("click",()=>setAll(0.5));
  document.getElementById("trNone").addEventListener("click",()=>setAll(0));
  document.getElementById("trCancel").addEventListener("click",closeModal);
  document.getElementById("trBackdrop").addEventListener("click",e=>{ if(e.target.id==="trBackdrop") closeModal(); });
  document.getElementById("trApply").addEventListener("click",async ()=>{
    const destId=document.getElementById("trDest").value;

/* ============================ IMPORT FORECAST (.xlsx, parsed in-browser) ============================ */
const MONTH_NAMES=["january","february","march","april","may","june","july","august","september","october","november","december"];
let bannerDismissed=false;
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function today(){ try{ return new Date().toISOString().slice(0,10); }catch(e){ return DATA_DATE; } }

async function inflateRaw(bytes){
  const ds=new DecompressionStream("deflate-raw");
  const ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(ab);
}
async function unzip(ab){
  const dv=new DataView(ab), u8=new Uint8Array(ab), dec=new TextDecoder();
  let eocd=-1; for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error("not a valid .xlsx");
  const count=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true); const files={};
  for(let n=0;n<count;n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), commentLen=dv.getUint16(off+32,true);
    const localOff=dv.getUint32(off+42,true);
    const name=dec.decode(u8.subarray(off+46,off+46+nameLen));
    const lNameLen=dv.getUint16(localOff+26,true), lExtraLen=dv.getUint16(localOff+28,true);
    const dataStart=localOff+30+lNameLen+lExtraLen;
    const comp=u8.subarray(dataStart,dataStart+compSize);
    files[name]= method===8 ? await inflateRaw(comp) : comp.slice();
    off+=46+nameLen+extraLen+commentLen;
  }
  return files;
}
function textOf(bytes){ return bytes? new TextDecoder().decode(bytes) : ""; }
function decodeXml(s){ return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d)).replace(/&amp;/g,"&"); }
function parseStrings(xml){ const a=[]; xml.replace(/<si>([\s\S]*?)<\/si>/g,(m,inner)=>{ let t=""; inner.replace(/<t[^>]*>([\s\S]*?)<\/t>/g,(x,y)=>{t+=y;return x;}); a.push(decodeXml(t)); return m;}); return a; }
function colToIdx(c){ let n=0; for(const ch of c) n=n*26+(ch.charCodeAt(0)-64); return n-1; }
function parseGrid(xml,strings){
  const rows=[];
  xml.replace(/<row[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g,(m,rn,inner)=>{
    const cells={};
    inner.replace(/<c r="([A-Z]+)\d+"([^>]*?)>([\s\S]*?)<\/c>/g,(x,col,attr,body)=>{
      const isS=/t="s"/.test(attr), isI=/t="(inlineStr|str)"/.test(attr);
      let v=""; const vm=body.match(/<v>([\s\S]*?)<\/v>/); if(vm)v=vm[1];
      if(isS)v=strings[parseInt(v)]||""; else if(isI){ const im=body.match(/<t[^>]*>([\s\S]*?)<\/t>/); v=im?decodeXml(im[1]):decodeXml(v); } else v=decodeXml(v);
      cells[colToIdx(col)]=v; return x;
    });
    rows[parseInt(rn)-1]=cells; return m;
  });

}
function readWorkbook(files){
  const strings=parseStrings(textOf(files["xl/sharedStrings.xml"]));
  const wb=textOf(files["xl/workbook.xml"]), rels=textOf(files["xl/_rels/workbook.xml.rels"]);
  const relMap={}; rels.replace(/<Relationship Id="([^"]+)"[^>]*Target="([^"]+)"/g,(m,id,t)=>{relMap[id]=t.replace(/^\//,"");return m;});
  const sheets=[]; wb.replace(/<sheet [^>]*?name="([^"]+)"[^>]*?r:id="([^"]+)"[^>]*?\/>/g,(m,nm,rid)=>{ let tgt=relMap[rid]||""; if(tgt&&!tgt.startsWith("xl/"))tgt="xl/"+tgt; sheets.push({name:decodeXml(nm),file:tgt}); return m;});
  return {strings,sheets};
}
function findForecastSheet(files,parsed){
  const cands=[];
  for(const sh of parsed.sheets){
    const bytes=files[sh.file]; if(!bytes) continue;
    const rows=parseGrid(textOf(bytes),parsed.strings);
    let best=null;
    for(let h=0;h<Math.min(8,rows.length);h++){
      const r=rows[h]||{}; const monthCols={};
      Object.keys(r).forEach(ci=>{ const mi=MONTH_NAMES.indexOf((r[ci]||"").toString().toLowerCase().trim()); if(mi>=0 && monthCols[ci]===undefined) monthCols[ci]=mi; });
      const cnt=Object.keys(monthCols).length;
      if(cnt>=6 && (!best || cnt>best.cnt)) best={headerRow:h,monthCols,cnt};
    }
    if(best){ // prefer a sheet named "…Forecast…", then the largest grid (the allocation matrix is biggest)
      const score=(/forecast/i.test(sh.name)?1e6:0)+rows.length;
      cands.push({sheet:sh,rows,headerRow:best.headerRow,monthCols:best.monthCols,score}); }
  }
  if(!cands.length) return null;
  cands.sort((a,b)=>b.score-a.score);
  return cands[0];
}
/* ---- Layout B: weekly "Backlog Forecast" grid (one row per person×project, weekly Hours/Dollars columns) ---- */
function isSerial(v){ return /^\d+(\.\d+)?$/.test(v) && +v>45000 && +v<47000; }
function monthOfSerial(v){ return new Date(Date.UTC(1899,11,30)+(+v)*86400000).getUTCMonth(); }
function findBacklogSheet(files,parsed){
  for(const sh of parsed.sheets){
    const rows=parseGrid(textOf(files[sh.file]),parsed.strings);
    for(let h=0;h<Math.min(6,rows.length);h++){
      const vals=Object.values(rows[h]||{}).map(v=>(v||"").toString().toLowerCase());
      if(vals.filter(v=>v==="hours").length>=3 && vals.filter(v=>v==="dollars").length>=3) return {sheet:sh,rows,hdRow:h};
    }
  }
  return null;
}
function interpretBacklog(bk){
  const {rows,hdRow}=bk; const hd=rows[hdRow]||{}, dateRow=rows[hdRow-1]||{};
  let firstDollars=Infinity;
  Object.keys(hd).forEach(ci=>{ if((hd[ci]||"").toString().toLowerCase()==="dollars") firstDollars=Math.min(firstDollars,+ci); });
  const hourCols=[];
  // year's first week is an unlabeled Hours column at (firstDollars-1); its date sits in the date row's col 0
  if(firstDollars!==Infinity && isSerial(dateRow[0])) hourCols.push({c:firstDollars-1, mi:monthOfSerial(dateRow[0])});
  Object.keys(hd).forEach(ci=>{ ci=+ci;
    if((hd[ci]||"").toString().toLowerCase()==="hours"){
      const d = isSerial(dateRow[ci-1])?dateRow[ci-1] : (isSerial(dateRow[ci])?dateRow[ci]:null);
      if(d!==null) hourCols.push({c:ci, mi:monthOfSerial(d)});   // skips monthly-subtotal columns (no date label)
    }
  });
  // project column = metadata column (before the weekly block) that most often looks like a client/project ("X - Y")
  const metaEnd = firstDollars===Infinity? 8 : firstDollars-1;
  let projCol=5, bestDash=-1;
  for(let c=1;c<metaEnd;c++){ let dash=0; for(let r=hdRow+1;r<rows.length;r++){ if((rows[r]&&rows[r][c]||"").toString().includes(" - ")) dash++; } if(dash>bestDash){bestDash=dash;projCol=c;} }
  // explicit bill-rate column, if the workbook has one in the metadata block (header contains "rate")
  let rateCol=-1;
  for(let c=0;c<metaEnd;c++){ if(/rate/i.test((hd[c]||"").toString())) { rateCol=c; break; } }
  // dollars column paired with each weekly hours column (hours at c → dollars at c+1)
  const dollarCols=hourCols.map(({c})=> (hd[c+1]||"").toString().toLowerCase()==="dollars"? c+1 : null);
  const records=[]; let skipped=0;
  for(let r=hdRow+1;r<rows.length;r++){ const row=rows[r]||{}; const person=(row[0]||"").toString().trim(); const project=(row[projCol]||"").toString().trim();
    if(!person||!project) continue;
    const months={}; let any=false, rowHrs=0, rowDol=0;
    hourCols.forEach(({c,mi},k)=>{ const v=parseFloat(row[c]); if(!isNaN(v)&&v!==0){ months[mi]=(months[mi]||0)+v; rowHrs+=v; any=true;
      const dc=dollarCols[k]; if(dc!==null){ const d=parseFloat(row[dc]); if(!isNaN(d)) rowDol+=d; } } });
    if(!any) continue;
    // A real project cell contains letters. A purely numeric value (e.g. a bill rate
    // typed into the wrong column) is not a project — skip it rather than invent a
    // phantom "150" project. Counted and surfaced in the preview, never silent.
    if(!/[a-z]/i.test(project)){ skipped++; continue; }
    // bill rate: explicit Rate column wins; otherwise derive from the row's dollars ÷ hours
    let rate=0;
    if(rateCol>=0){ const rv=parseFloat(row[rateCol]); if(!isNaN(rv)&&rv>0) rate=rv; }
    if(!rate && rowDol>0 && rowHrs>0) rate=rowDol/rowHrs;
    records.push({person,project,months,rate,
      role:(row[projCol-1]||"").toString().trim(), dept:(row[projCol-2]||"").toString().trim()});
  }
  records.skipped=skipped;
  return records;
}
function interpretForecast(fsheet){
  const {rows,headerRow,monthCols}=fsheet;
  const isMarker=s=>/^(total|weekly average|weekly avg|billable target|grand total|monthly total|available)/i.test((s||"").trim());
  const isEnd=s=>/^(total|grand total|monthly total)/i.test((s||"").trim());
  const records=[]; let cur=null;
  for(let i=headerRow+1;i<rows.length;i++){
    const row=rows[i]||{}; const a=(row[0]||"").toString().trim();
    if(!a) continue;
    if(isMarker(a)){ if(isEnd(a)) cur=null; continue; }
    if(cur===null){ cur=a; continue; }
    const months={}; let any=false;
    Object.keys(monthCols).forEach(ci=>{ const val=parseFloat(row[ci]); if(!isNaN(val)&&val!==0){ const mi=monthCols[ci]; months[mi]=(months[mi]||0)+val; any=true; } });
    if(any) records.push({person:cur,project:a,months});
  }
  return records;
}
/* fuzzy mapping guesses */
function normName(s){ return (s||"").toString().toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function guessPerson(name){
  const nn=normName(name); if(!nn) return "";
  let hit=PEOPLE.find(p=>normName(p.name)===nn); if(hit) return hit.id;            // exact full name
  const f=nn.split(" ")[0];                                                        // unique first name
  const fh=PEOPLE.filter(p=>normName(p.name).split(" ")[0]===f); if(fh.length===1) return fh[0].id;
  const parts=nn.split(" "), last=parts[parts.length-1];                           // unique last name (catches typos)
  const lh=PEOPLE.filter(p=>{const q=normName(p.name).split(" ");return q[q.length-1]===last;}); if(lh.length===1) return lh[0].id;
  return "";
}
const STOPW=new Set("the and of for to a co inc llc company companies group sub".split(" "));
function projTokens(s){
  return normName(s)
    .replace(/([a-z])(\d)/g,"$1 $2")                                   // "Phase1" → "phase 1" (leaves "2a"/"2b" intact)
    .split(" ")
    .filter(w=> w && !STOPW.has(w) && (w.length>=2 || /\d/.test(w)));  // keep short numeric tokens like "1"
}
/* Score the sheet's project string against BOTH sources (PRJ + CRM) and take the genuine best match.
   A hit on the project NAME counts double a hit on the client, and a candidate must match the name at
   all — otherwise a shared client (e.g. a CRM opp whose customer is Con Edison) can hijack the match.
   Ties go to PRJ (real delivery work) over CRM (pipeline). */
function guessProject(name){
  const nt=projTokens(name); if(!nt.length) return "";
  let best="", bestScore=0, bestSrc="";
  for(const pr of ALL_PROJECTS){
    const nameTok=new Set(projTokens(pr.name)), cliTok=new Set(projTokens(pr.client||""));
    let nameScore=0, cliScore=0;
    nt.forEach(t=>{
      if(nameTok.has(t)) nameScore+=2;
      else if(t.length>=3 && [...nameTok].some(x=>x.includes(t)||t.includes(x))) nameScore+=1;   // "con" → "ConEd"
      else if(cliTok.has(t)) cliScore+=1.5;      // a client/company hit beats a generic word like "implementation"
      else if(t.length>=3 && [...cliTok].some(x=>x.includes(t)||t.includes(x))) cliScore+=0.75;
    });
    if(nameScore<=0) continue;                 // client-only overlap is not a match
    const sc=nameScore+cliScore;
    if(sc<2) continue;
    if(sc>bestScore || (sc===bestScore && pr.src==="PRJ" && bestSrc==="CRM")){ bestScore=sc; best=pr.id; bestSrc=pr.src; }
  }
  return best;
}
const HIRE_RX=/resource|to.?be.?hired|\btbh\b|\btbd\b|new hire|open role|vacan|placeholder|unfilled|\bhire\b/i;
function looksLikeHire(name){ return HIRE_RX.test(name||""); }
/* Standard delivery roles = the distinct job titles Odoo already shows for the
   roster (which is limited to delivery departments). The import snaps each sheet
   role to the closest of these so To-Be-Hired seats group under real, comparable
   roles rather than free-text like "Technical Consultant / Developer". */
function deliveryRoles(){ return [...new Set(PEOPLE.map(p=>(p.role||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)); }
const SENIOR_RX=/\b(senior|snr|sr|lead|principal|staff)\b/i;
function roleTokens(s){ return normName(s).replace(/\bsnr\b/g,"senior").replace(/\bsr\b/g,"senior").split(" ").filter(w=>w && !STOPW.has(w) && w.length>=2); }
/* Best standard role for a free-text sheet role: token overlap, nudged so seniority
   lines up ("Senior …" prefers a "Senior …" title). "" when the match is too weak. */
function matchRole(sheetRole){
  const roles=deliveryRoles(); const st=roleTokens(sheetRole||""); if(!roles.length||!st.length) return "";
  const sSenior=SENIOR_RX.test(sheetRole||""); let best="", bestScore=0;
  for(const r of roles){ const rt=new Set(roleTokens(r)); let sc=0;
    st.forEach(t=>{ if(rt.has(t)) sc+=2; else if(t.length>=4 && [...rt].some(x=>x.includes(t)||t.includes(x))) sc+=1; });
    if(sc<=0) continue; if(SENIOR_RX.test(r)===sSenior) sc+=1;
    if(sc>bestScore){ bestScore=sc; best=r; } }
  return bestScore>=2 ? best : "";
}

  deliveryRoles().map(r=>`<option value="${esc(r)}"${r===sel?" selected":""}>${esc(r)}</option>`).join(""); }
/* What the matcher would pick on its own. Unmatched people now default to a
   To-Be-Hired seat (not "skip") so their forecast is never silently dropped; a

function autoPerson(n){ const g=guessPerson(n); return g? String(g) : "__tbh__"; }
function autoProject(n){ const a=guessProject(n); return a? String(a) : "skip"; }

function personOptions(sel){ return `<option value="skip"${sel==="skip"?" selected":""}>— skip —</option>`+

async function handleXlsxFile(file){

  try{

    const ab=await file.arrayBuffer();

    if(bk){ records=interpretBacklog(bk); sheetName=bk.sheet.name; }
    if(!records || !records.length){                    // Layout A: month-column person blocks
      const fsheet=findForecastSheet(files,parsed);
      if(fsheet){ records=interpretForecast(fsheet); sheetName=fsheet.sheet.name; }
    }
    if(!records){ toast("No forecast grid found — expected weekly Hours/Dollars columns or monthly columns."); return; }
    if(!records.length){ toast("Forecast sheet found, but no staffed hours to import."); return; }
    openImportModal(records, sheetName);
  }catch(err){ toast("Import failed: "+(err&&err.message?err.message:err)); }
}

function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }
function applyImport(records,pmap,prmap,sheetName,rolemap){
  // Remember ONLY what the user changed. Anything matching the auto-guess is left unstored so the
  // next import re-runs the matcher (and picks up any improvement) rather than replaying a stale pick.
  Object.keys(pmap).forEach(n=>{
    const manual = String(pmap[n])!==autoPerson(n);
    if(manual) state.importMap.people[n]=pmap[n]; else delete state.importMap.people[n];
    api("PUT","/api/importmap",{kind:"person",sourceName:n,targetKey:manual?String(pmap[n]):null}).catch(()=>{});
  });
  Object.keys(prmap).forEach(n=>{
    const manual = String(prmap[n])!==autoProject(n);
    if(manual) state.importMap.projects[n]=prmap[n]; else delete state.importMap.projects[n];
    api("PUT","/api/importmap",{kind:"project",sourceName:n,targetKey:manual?String(prmap[n]):null}).catch(()=>{});
  });
  state.importMap.v=MATCH_V;
  state.alloc={}; state.capacity=state.capacity||{};
  // Unmatched sheet people pool into ONE To-Be-Assigned entry per role
  // ("TBA - Technical Consultant"): resourcing is against the role, not a named
  // seat, so two unmatched people with the same role land in the same pool and
  // their hours accumulate. Pools are persisted via /api/tbh (demand-only: no
  // capacity or start month).
  rolemap=rolemap||{};
  const tbhByPerson={}, poolById={};
  [...new Set(records.map(r=>r.person))].filter(n=>pmap[n]==="__tbh__").forEach(name=>{
    const rec=records.find(r=>r.person===name)||{};
    const role=(rolemap[name]||matchRole(rec.role||"")||"").trim();
    const dept=DEPTS.includes(rec.dept)?rec.dept:"";
    // Shore from the sheet's bill rate (weighted average across the person's
    // rated rows): under $100/hr reads as offshore; no rate defaults onshore.
    let rh=0, rd=0;
    records.filter(r=>r.person===name && r.rate>0).forEach(r=>{ const t=Object.values(r.months).reduce((s,x)=>s+x,0); rh+=t; rd+=t*r.rate; });
    const shore = (rh>0 && rd/rh<100) ? "offshore" : "onshore";
    const id="tbh-"+slugRole(role,shore);
    tbhByPerson[name]={id};
    if(!poolById[id]) poolById[id]={id,name:tbaLabel(role,shore),role,dept,shore};
  });
  Object.values(poolById).forEach(s=>{
    const ex=state.tbh.find(t=>String(t.id)===String(s.id));
    if(ex){ ex.name=s.name; ex.role=s.role; ex.shore=s.shore; if(!ex.dept) ex.dept=s.dept; }
    else state.tbh.push({id:s.id,name:s.name,role:s.role,dept:s.dept,shore:s.shore,type:"tbh",start:null,cap:null});
    api("PUT","/api/tbh",{tbhKey:String(s.id).replace(/^tbh-/,""),name:s.name,role:s.role,dept:s.dept,shore:s.shore,start:null,cap:null}).catch(()=>{});
  });
  let applied=0;
  const rateHrs={}, rateDol={};   // per mapped person|project pair: hours & dollars from rated rows → weighted avg bill rate
  records.forEach(r=>{ let pid=pmap[r.person]; const prj=prmap[r.project];
    if(pid==="__tbh__") pid=tbhByPerson[r.person] && tbhByPerson[r.person].id;
    if(!pid||pid==="skip"||!prj||prj==="skip") return;
    if(r.rate){ const t=Object.values(r.months).reduce((s,x)=>s+x,0), k=pid+"||"+prj;
      rateHrs[k]=(rateHrs[k]||0)+t; rateDol[k]=(rateDol[k]||0)+t*r.rate; }
    Object.keys(r.months).forEach(mi=>{ mi=+mi; if(isPastMi(mi)) return;   // past months come from actuals, not forecast
      const M=MONTHS[mi]; if(!M) return;
      setAlloc(pid,prj,M.key, alloc(pid,prj,M.key)+r.months[mi]); applied++; });
  });
  // bill rates from the workbook (dollars ÷ hours, weighted across a pair's SO lines) — per person × project
  let rated=0;
  Object.keys(rateHrs).forEach(k=>{ if(rateHrs[k]>0 && rateDol[k]>0){ const i=k.indexOf("||"), pid=k.slice(0,i), prj=k.slice(i+2);
    setPairRateLocal(pid,prj,Math.round(rateDol[k]/rateHrs[k])); rated++; } });
  state.lastImport={sheet:sheetName,date:today(),count:applied}; bannerDismissed=false;
  closeModal(); render();
  const batch=[];
  Object.keys(state.alloc).forEach(pid=>Object.keys(state.alloc[pid]).forEach(jid=>
    Object.keys(state.alloc[pid][jid]).forEach(mk=>{
      const mi=MONTHS.findIndex(m=>m.key===mk); if(mi<0||isPastMi(mi)) return;
      batch.push({resourceKey:resKey(pid),targetKey:tgtKey(jid),month:mk,hours:state.alloc[pid][jid][mk],version:VER[verKey(pid,jid,mk)]||0});
    })));
  pushBatch(batch, "Imported "+applied+" allocations from "+sheetName, {mode:"import"})
    .then(async ok=>{
      if(!ok) return;
      // persist the imported pair rates after the allocations land
      for(const pid of Object.keys(state.rates)){
        for(const jid of Object.keys(state.rates[pid])){
          await pushRate(pid,jid,state.rates[pid][jid]);
        }
      }
      if(rated) toast("Imported "+rated+" bill rates from "+sheetName);
    });
  toast("Imported "+applied+" allocations from "+sheetName);
}

function bulkRange(){
  const si=MONTHS.findIndex(m=>m.key===document.getElementById("bkStart").value);
  const ei=MONTHS.findIndex(m=>m.key===document.getElementById("bkEnd").value);
  let a=Math.min(si,ei), b=Math.max(si,ei); a=Math.max(a,CURRENT_MI);
  const months=[]; for(let i=a;i<=b;i++) if(!isPastMi(i)) months.push(i);
  return months;
}
function bulkValues(months){
  const hours=Math.max(0,parseFloat(document.getElementById("bkHours").value)||0);

  if(document.getElementById("bkMode").value==="permonth") return months.map(()=>Math.round(hours));
  const per=Math.round(hours/n), vals=months.map(()=>per);
  vals[n-1]+=Math.round(hours)-per*n; if(vals[n-1]<0) vals[n-1]=0;
  return vals;
}

/* ==================== SHIFT TBH FORECAST -> EMPLOYEE ==================== */
/* The hire happened: move a seat's remaining (current-month-onward) forecast onto
   the real employee — all projects to one person, or split per project. Closed
   months never move; the server enforces the same boundary. */
function tbhFutureByProject(tid){
  const out={}; const a=state.alloc[tid]; if(!a) return out;
  for(const proj in a) for(const mk in a[proj]){
    const mi=MKEYS.indexOf(mk);
    if(mi>=CURRENT_MI && a[proj][mk]>0) out[proj]=(out[proj]||0)+a[proj][mk];
  }
  return out;
}
function shiftEmpOpts(sel){
  return PEOPLE.slice().sort((a,b)=>DEPTS.indexOf(a.dept)-DEPTS.indexOf(b.dept)||a.name.localeCompare(b.name))
    .map(p=>`<option value="${p.id}"${String(sel)===String(p.id)?" selected":""}>${esc(p.name)} · ${esc(p.role||p.dept)}</option>`).join("");
}
/* cells where the chosen employee already has forecast on the same project+month */
function shiftCollisions(tid){
  let n=0;
  document.querySelectorAll("[data-shrow]").forEach(row=>{
    if(!row.querySelector("[data-shsel]").checked) return;
    const proj=row.dataset.shrow, eid=row.querySelector("[data-shemp]").value;
    const src=state.alloc[tid]&&state.alloc[tid][proj], dst=state.alloc[eid]&&state.alloc[eid][proj];
    if(!src||!dst) return;
    for(const mk in src){ const mi=MKEYS.indexOf(mk); if(mi>=CURRENT_MI && src[mk]>0 && dst[mk]>0) n++; }
  });
  return n;
}

  const hint=document.getElementById("shRemoveHint"); if(hint) hint.textContent = all? "" : "(some projects stay — removing the pool would drop their forecast)";
  document.getElementById("shApply").disabled = !any;
}
function openShiftModal(tid){
  const t=state.tbh.find(x=>String(x.id)===String(tid)); if(!t) return;
  const byProj=tbhFutureByProject(tid);
  const projs=sortProjIds(Object.keys(byProj));
  if(!projs.length){ toast("This role pool has no forecast from the current month onward."); return; }
  const defEmp=(PEOPLE[0]||{}).id;
  const hasRates=projs.some(p=>pairRate(tid,p)>0);
  const rows=projs.map(p=>{ const pr=projById(p);
    // A proposed hire that now matches a real Odoo person preselects that person.
    const prop=proposedFor(tid,p); const match=prop? guessPerson(prop) : "";
    return `<tr data-shrow="${esc(String(p))}">`+
    `<td style="text-align:center"><input type="checkbox" data-shsel checked></td>`+
    `<td class="src">${pr?esc(projLabel(pr)):esc(String(p))}${pr&&pr.client?`<div class="muted" style="font-size:11px">${esc(pr.client)}</div>`:""}`+
      (prop?`<div class="muted" style="font-size:11px">proposed: <b>${esc(prop)}</b>${match?" ✓ matched":""}</div>`:"")+`</td>`+
    `<td class="hrs">${fmt0(byProj[p])}h${pairRate(tid,p)?`<div class="muted" style="font-size:11px">$${fmt(pairRate(tid,p))}/hr</div>`:""}</td>`+
    `<td><select data-shemp>${shiftEmpOpts(match||defEmp)}</select></td></tr>`; }).join("");
  document.getElementById("modalRoot").innerHTML=`<div class="backdrop" id="shBackdrop"><div class="modal" style="width:min(760px,100%)" role="dialog" aria-modal="true">
    <div class="modal-hd"><h2>Shift forecast to employee</h2>
      <p><b>${esc(t.name)}</b> · ${esc(t.role||"")} — move this role's unassigned forecast (${MONTHS[CURRENT_MI]?MONTHS[CURRENT_MI].name+"–"+MONTHS[11].name:"remaining months"}) onto the person who was assigned or hired. Closed months stay behind.</p></div>
    <div class="modal-bd">
      <div class="field"><label>Move everything to</label><select id="shAll">${shiftEmpOpts(defEmp)}</select></div>
      <div class="scrollbox"><table class="maptbl"><thead><tr><th></th><th>Project</th><th>Hours</th><th>Moves to</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div id="shCollide" style="display:none">
        <div class="field"><label>⚠ <span id="shCollideN">0</span> month-cell(s) already have hours on the employee — what should happen?</label>
        <select id="shMode">
          <option value="sum" selected>Add the hours together</option>
          <option value="replace">Replace with the pool's hours</option>
          <option value="skip">Skip those cells (they stay on the pool)</option>
        </select></div>
      </div>
      ${hasRates?`<div class="field"><label>Bill rates on this role's lines</label>
        <select id="shRates">
          <option value="overwrite" selected>Copy the rate from the TBH to the employee / project combination</option>
          <option value="copy">Leave the rate that already exists for the employee / project combination</option>
          <option value="none">Don't copy — set the rate manually</option>
        </select></div>`:""}
      <label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="shRemove" checked> Also remove the TBA role pool afterwards <span class="muted" id="shRemoveHint" style="font-size:11.5px"></span></label>
    </div>
    <div class="modal-ft"><span class="muted" style="font-size:12px">Every move is audited. Nothing changes until you apply.</span>
      <span style="display:flex;gap:8px"><button class="btn" id="shCancel">Cancel</button><button class="btn primary" id="shApply">Shift forecast</button></span></div>
  </div></div>`;
  document.getElementById("shCancel").addEventListener("click",closeModal);
  document.getElementById("shBackdrop").addEventListener("click",e=>{ if(e.target.id==="shBackdrop") closeModal(); });
  document.getElementById("shAll").addEventListener("change",e=>{
    document.querySelectorAll("[data-shemp]").forEach(s=>s.value=e.target.value); refreshShiftUI(tid); });
  document.getElementById("shBackdrop").addEventListener("change",e=>{
    if(e.target.matches("[data-shemp],[data-shsel]")) refreshShiftUI(tid); });
  document.getElementById("shApply").addEventListener("click",()=>applyShift(tid));
  refreshShiftUI(tid);
}
async function applyShift(tid){
  const moves=[];
  document.querySelectorAll("[data-shrow]").forEach(row=>{
    if(!row.querySelector("[data-shsel]").checked) return;
    moves.push({ targetKey:tgtKey(row.dataset.shrow), employeeId:Number(row.querySelector("[data-shemp]").value) });
  });
  if(!moves.length){ toast("Select at least one project to move."); return; }
  const modeSel=document.getElementById("shMode"), rateSel=document.getElementById("shRates");
  const removeSeat=document.getElementById("shRemove").checked;
  const btn=document.getElementById("shApply"); btn.disabled=true; btn.textContent="Shifting…";
  try{
    status("Shifting forecast…");
    const r=await api("POST","/api/tbh/shift",{
      tbhKey:String(tid).replace(/^tbh-?/,""), moves,
      collisionMode: modeSel? modeSel.value : "sum",
      rateMode: rateSel? rateSel.value : "copy",
      removeSeat,
    });
    closeModal();
    toast(`Forecast shifted — ${r.moved} cell${r.moved===1?"":"s"} moved`+
      (r.merged?`, ${r.merged} merged`:"")+(r.replaced?`, ${r.replaced} replaced`:"")+(r.skipped?`, ${r.skipped} skipped`:"")+
      (r.ratesCopied?`, ${r.ratesCopied} rate${r.ratesCopied===1?"":"s"} copied`:"")+(r.seatRemoved?" · pool removed":"")+".");
    await bootstrap();   // reload the shared plan from the server's new truth
  }catch(e){ status("Shift failed"); toast("Shift failed: "+(e&&e.message?e.message:e)); btn.disabled=false; btn.textContent="Shift forecast"; }
}

/* ============================ INIT ============================ */
(function initFilters(){
  const sel=document.getElementById("fDept");
  sel.innerHTML=`<option value="all">All departments</option>`+DEPTS.map(d=>`<option value="${d}">${d}</option>`).join("")+`<option value="__none__">Unassigned</option>`;
})();
document.getElementById("foot").innerHTML=
  `Roster &amp; projects from Odoo via CData · ${DATA_DATE}. ${PEOPLE.length} people · ${PROJECTS.length} PRJ projects + ${CRM_PROJECTS.length} CRM pipeline opportunities · calendar year ${YEAR}. `+
  `<b>Closed months show actual timesheet hours (locked)</b>; the current month onward is forecast. `+
  `Use <b>Import forecast</b> to load your CY26 workbook (parsed in your browser — nothing is uploaded). `+
  `Shared plan — every change is saved for everyone and attributed to you.`;

/* ============================ BOOTSTRAP ============================ */
/* One round-trip: identity + Odoo reference data + the shared plan. Nothing is
   rendered until this resolves, so we never show a stale or empty grid as if it
   were real. */
async function bootstrap(){
  status("Loading…");
  const { me, reference, plan } = await api("GET","/api/bootstrap");

  ME = me;
  PEOPLE = reference.people.map(p=>({ ...p, id:p.id }));
  PROJECTS = reference.projects.map(p=>({ ...p, src:"PRJ" }));
  CRM_PROJECTS = reference.opportunities.map(o=>({ id:"crm-"+o.id, name:o.name, client:o.client, stage:o.stage, src:"CRM", billable:true, needsProject:!!o.needsProject,
    expectedStart:o.expectedStart||null, expectedMonths:o.expectedMonths||0 }));
  rebuildProjects();
  SYNC = reference.sync || [];

  ACTUALS = new Map(); ACT_PERSON_PROJ = new Map(); ACT_RATES = new Map();
  reference.actuals.forEach(a=>{
    ACTUALS.set(`${a.employeeId}|${a.projectId}|${a.month}`, a.hours);
    if(a.billRate) ACT_RATES.set(`${a.employeeId}|${a.projectId}|${a.month}`, a.billRate);
    const k=String(a.employeeId);
    if(!ACT_PERSON_PROJ.has(k)) ACT_PERSON_PROJ.set(k, new Set());
    ACT_PERSON_PROJ.get(k).add(String(a.projectId));
  });

  // plan -> local mirror, remembering each row's version for optimistic concurrency
  state.alloc={}; VER={};
  plan.allocations.forEach(a=>{
    const pid=fromResKey(a.resourceKey), jid=fromTgtKey(a.targetKey);
    setAlloc(pid,jid,a.month,a.hours);
    VER[`${a.resourceKey}|${a.targetKey}|${a.month}`]=a.version;
  });
  state.capacity={}; plan.capacity.forEach(c=>{ state.capacity[fromResKey(c.resourceKey)]=c.hoursPerMonth; });
  state.rates={}; RATE_VER={};
  (plan.rates||[]).forEach(r=>{
    setPairRateLocal(fromResKey(r.resourceKey), fromTgtKey(r.targetKey), r.rate);
    RATE_VER[`${r.resourceKey}|${r.targetKey}`]=r.version;
  });
  state.tbh = plan.tbh.map(t=>({ id:"tbh-"+t.tbhKey, name:t.name, role:t.role, dept:t.dept, shore:t.shore||"onshore", type:"tbh", start:t.start, cap:t.cap }));
  // proposed-hire names per (TBA pool × project), keyed "uiResourceId|uiProjId"
  state.proposed={};
  (plan.proposed||[]).forEach(p=>{ state.proposed[`${fromResKey(p.resourceKey)}|${fromTgtKey(p.targetKey)}`]=p.name; });
  // The API returns remembered import mappings keyed by import_map.kind — 'person'
  // and 'project' (singular). The UI works in 'people'/'projects' (plural), so map
  // them here; without this state.importMap.people is undefined and the import
  // modal throws "Cannot use 'in' operator … in undefined" on the first row.
  state.importMap = { people:(plan.importMap&&plan.importMap.person)||{}, projects:(plan.importMap&&plan.importMap.project)||{}, v:MATCH_V };

  // Departments now that the Odoo roster is loaded: rebuild the list and the
  // filter dropdown, keeping the user's selection when it still exists.
  refreshDeptFilter();

  document.body.classList.toggle("viewer", !ME.canEdit);
  document.body.classList.toggle("noimport", !ME.canImport);   // forecast import is importer-only
  // The Planner Assistant exists only when the server has an Anthropic key.
  const btnAI = document.getElementById("btnAI");
  if (btnAI) btnAI.hidden = !ME.agentEnabled;
  const who=document.getElementById("whoami");
  if(who) who.innerHTML = `${esc(ME.name||ME.upn)} · ${ME.canEdit?"editor":"view only"} · <a href="/auth/logout">sign out</a>`;

  const stale = SYNC.length===0;
  const foot=document.getElementById("foot");
  if(foot) foot.innerHTML =
    `${PEOPLE.length} people · ${PROJECTS.length} PRJ projects + ${CRM_PROJECTS.length} CRM opportunities · calendar year ${YEAR}. `+
    (stale ? `<b>Odoo reference data has never been synced</b> — run a sync to populate people and projects.`
           : `Odoo last synced ${SYNC.map(s=>`${s.source.replace("ref_","")} ${String(s.at).slice(0,10)}`).join(" · ")}.`)+
    `<br>Shared plan — every change is saved for everyone and attributed to you.`;

  status("Up to date");
  render();
}

/* ============================ PLANNER ASSISTANT ============================ */
/* Chat client for /api/agent. The browser keeps the raw conversation (AI.api)
   and echoes it on every request — the server is stateless and authority always
   comes from the session cookie, never from this transcript. Write proposals
   come back as pending cards; nothing is saved until Approve is clicked. */
const AI = { msgs: [], api: [], pending: null, busy: false };

function aiOpen(open){
  document.getElementById("aiPanel").hidden = !open;
  if (open){
    if (!AI.msgs.length) AI.msgs.push({ who:"sys", text:"Ask about the plan (\"who is under-allocated in November?\") or ask for a change (\"move Jordan's October hours on Northwind to the offshore TC pool\")." });
    aiRender();
    document.getElementById("aiText").focus();
  }
}

function aiReset(){
  AI.msgs = []; AI.api = []; AI.pending = null; AI.busy = false;
  aiOpen(true);
}

function aiRender(){
  const log = document.getElementById("aiLog");
  if (!log) return;
  let h = AI.msgs.map(m => `<div class="ai-msg ${m.who}">${esc(m.text)}</div>`).join("");
  if (AI.pending){
    h += AI.pending.items.map(p => {
      const cls = p.decision === true ? " approved" : p.decision === false ? " declined" : "";
      const acts = p.decision == null
        ? `<div class="acts"><button class="ok" data-aiok="${esc(p.id)}">Approve</button><button class="no" data-aino="${esc(p.id)}">Decline</button></div>`
        : `<div class="decided">${p.decision ? "✓ Approved" : "✕ Declined"}</div>`;
      return `<div class="ai-card${cls}"><div class="lbl">Proposed change</div><div class="sum">${esc(p.summary)}</div>${acts}</div>`;
    }).join("");
  }
  if (AI.busy) h += `<div class="ai-busy">Thinking</div>`;
  log.innerHTML = h;
  log.scrollTop = log.scrollHeight;
  const send = document.getElementById("aiSend");
  if (send) send.disabled = AI.busy || !!AI.pending;
}

async function aiCall(payload){
  AI.busy = true; aiRender();
  try{
    const r = await api("POST","/api/agent", payload);
    AI.api = r.messages || AI.api;
    if (r.awaitingApproval){
      if (r.replySoFar) AI.msgs.push({ who:"ai", text:r.replySoFar });
      AI.pending = { items:(r.pending||[]).map(p=>({ ...p, decision:null })), completed:r.completed||[] };
    } else {
      AI.pending = null;
      AI.msgs.push({ who:"ai", text:r.reply || "(no reply)" });
      if (r.executedWrites){
        toast(`Assistant saved ${r.executedWrites} change${r.executedWrites>1?"s":""} — refreshing`);
        bootstrap();                       // pull the updated shared plan into the grids
      }
    }
  }catch(e){
    AI.msgs.push({ who:"sys", text:"⚠ "+e.message });
    AI.pending = null;
  }
  AI.busy = false; aiRender();
}

function aiSend(){
  if (AI.busy || AI.pending) return;
  const box = document.getElementById("aiText");
  const text = box.value.trim();
  if (!text) return;
  box.value = "";
  AI.msgs.push({ who:"you", text });
  aiCall({ text, messages: AI.api });
}

function aiDecide(id, yes){
  if (!AI.pending) return;
  const p = AI.pending.items.find(x => x.id === id);
  if (!p || p.decision != null) return;
  p.decision = yes;
  aiRender();
  if (AI.pending.items.every(x => x.decision != null)){
    const approved = AI.pending.items.filter(x => x.decision).length;
    const declined = AI.pending.items.length - approved;
    AI.msgs.push({ who:"sys", text:`${approved} approved · ${declined} declined` });
    const decisions = {};
    AI.pending.items.forEach(x => { decisions[x.id] = x.decision === true; });
    const completed = AI.pending.completed;
    AI.pending = null;
    aiCall({ resume:{ messages: AI.api, completed, decisions } });
  }
}

document.getElementById("btnAI").addEventListener("click", ()=>aiOpen(document.getElementById("aiPanel").hidden));
document.getElementById("aiClose").addEventListener("click", ()=>aiOpen(false));
document.getElementById("aiNew").addEventListener("click", aiReset);
document.getElementById("aiSend").addEventListener("click", aiSend);
document.getElementById("aiText").addEventListener("keydown", e=>{
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); aiSend(); }
});
document.getElementById("aiLog").addEventListener("click", e=>{
  const ok = e.target.closest("[data-aiok]"), no = e.target.closest("[data-aino]");
  if (ok) aiDecide(ok.dataset.aiok, true);
  if (no) aiDecide(no.dataset.aino, false);
});

bootstrap().catch(e=>{
  document.getElementById("viewRoot").innerHTML =
    `<div class="panel"><div class="panel-hd"><h2>Couldn't load the plan</h2></div>`+
    `<div style="padding:18px"><p>${esc(e.message)}</p>`+
    `<p class="muted">If this persists, check the service logs — the database or Odoo reference data may not be ready yet.</p></div></div>`;
  status("Offline");
});
</script>
