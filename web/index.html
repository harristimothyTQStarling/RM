<title>TQStarling Resource Planner</title>
<style>
  :root{
    /* Default (no explicit choice): honor the OS light/dark preference — this also
       themes native controls (number inputs, selects) and scrollbars to match. */
    color-scheme: light dark;
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eff3f8;
    --ink:#16202e; --ink-2:#42505f; --muted:#71808f; --faint:#9aa7b4;
    --line:#dde3ea; --line-strong:#c8d1db;
    --accent:#0f7f8c; --accent-ink:#0b5d67; --accent-wash:#e4f2f3;
    --tbh:#8a5cf6; --tbh-wash:#efe9fe;
    /* utilization semantic scale (separate from accent) */
    --u-none:#eef1f5; --u-none-ink:#8b97a4;
    --u-under:#dbeafe; --u-under-ink:#2c5a9e;
    --u-good:#d7f0dd; --u-good-ink:#1f7a44;
    --u-full:#fdeecc; --u-full-ink:#8a6410;
    --u-over:#fcdcd9; --u-over-ink:#b23b32;
    --u-orange:#ffe3c2; --u-orange-ink:#b25e15;
    --u-greenx:#9fd9ae; --u-greenx-ink:#0b5a2c;
    --shadow:0 1px 2px rgba(20,32,46,.06),0 6px 20px rgba(20,32,46,.06);
    --radius:11px; --radius-sm:7px;
    --mono:"SFMono-Regular",ui-monospace,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e141c; --surface:#161f2b; --surface-2:#1a2531; --surface-3:#202c3a;
      --ink:#eaf0f6; --ink-2:#b9c6d3; --muted:#8496a6; --faint:#61707f;
      --line:#26323f; --line-strong:#33424f;
      --accent:#3bc4cf; --accent-ink:#8fe3ea; --accent-wash:#123138;
      --tbh:#a98bff; --tbh-wash:#241a44;
      --u-none:#1c2733; --u-none-ink:#7d8b98;
      --u-under:#1a3350; --u-under-ink:#8fb8ea;
      --u-good:#153a2a; --u-good-ink:#68d295;
      --u-full:#3d3316; --u-full-ink:#e6c266;
      --u-over:#43211f; --u-over-ink:#f0928a;
      --u-orange:#40260f; --u-orange-ink:#f0b06e;
      --u-greenx:#1e5836; --u-greenx-ink:#84e6a6;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eff3f8;
    --ink:#16202e; --ink-2:#42505f; --muted:#71808f; --faint:#9aa7b4;
    --line:#dde3ea; --line-strong:#c8d1db;
    --accent:#0f7f8c; --accent-ink:#0b5d67; --accent-wash:#e4f2f3;
    --tbh:#8a5cf6; --tbh-wash:#efe9fe;
    --u-none:#eef1f5; --u-none-ink:#8b97a4;
    --u-under:#dbeafe; --u-under-ink:#2c5a9e;
    --u-good:#d7f0dd; --u-good-ink:#1f7a44;
    --u-full:#fdeecc; --u-full-ink:#8a6410;
    --u-over:#fcdcd9; --u-over-ink:#b23b32;
    --u-orange:#ffe3c2; --u-orange-ink:#b25e15;
    --u-greenx:#9fd9ae; --u-greenx-ink:#0b5a2c;
    --shadow:0 1px 2px rgba(20,32,46,.06),0 6px 20px rgba(20,32,46,.06);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0e141c; --surface:#161f2b; --surface-2:#1a2531; --surface-3:#202c3a;
    --ink:#eaf0f6; --ink-2:#b9c6d3; --muted:#8496a6; --faint:#61707f;
    --line:#26323f; --line-strong:#33424f;
    --accent:#3bc4cf; --accent-ink:#8fe3ea; --accent-wash:#123138;
    --tbh:#a98bff; --tbh-wash:#241a44;
    --u-none:#1c2733; --u-none-ink:#7d8b98;
    --u-under:#1a3350; --u-under-ink:#8fb8ea;
    --u-good:#153a2a; --u-good-ink:#68d295;
    --u-full:#3d3316; --u-full-ink:#e6c266;
    --u-over:#43211f; --u-over-ink:#f0928a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1320px;margin:0 auto;padding:20px 20px 80px;}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em;}
  .tnum{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;font-size:13px;cursor:pointer;}
  a{color:var(--accent-ink);}

  /* ---------- Header ---------- */
  header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .glyph{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));
    display:grid;place-items:center;color:#fff;flex:0 0 auto;box-shadow:var(--shadow);}
  .glyph svg{width:22px;height:22px;}
  .brand .title{font-size:19px;line-height:1.1;}
  .brand .sub{color:var(--muted);font-size:12px;margin-top:2px;letter-spacing:.02em;}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
    padding:7px 12px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-ink);color:#fff;}
  .btn svg{width:15px;height:15px;}
  .save-pill{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:20px;background:var(--surface-3);border:1px solid var(--line);}
  .save-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--u-good-ink);}

  /* ---------- KPI strip ---------- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;}
  .kpi .val{font-size:24px;font-weight:680;letter-spacing:-.02em;margin-top:4px;}
  .kpi .val small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;}
  .kpi .meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
  /* utilization tone on KPI values (text colour only — no fill) */
  .kpi .val.uv-over{color:var(--u-over-ink);}
  .kpi .val.uv-full{color:var(--u-full-ink);}
  .kpi .val.uv-good{color:var(--u-good-ink);}
  .kpi .val.uv-greenx{color:var(--u-greenx-ink);}
  .kpi .val.uv-none{color:var(--muted);}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}

  /* ---------- Tabs + filters ---------- */
  .barrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .tabs{display:inline-flex;background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;}
  .tab{border:none;background:transparent;color:var(--ink-2);padding:7px 13px;border-radius:7px;font-weight:550;white-space:nowrap;}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow);}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select,input[type=text],input[type=number]{font-family:inherit;font-size:13px;color:var(--ink);
    background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:6px 9px;}
  select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .search{min-width:180px;}

  /* ---------- Panels ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .panel + .panel{margin-top:14px;}
  .panel-hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);}
  .panel-hd h2{font-size:14px;}
  .panel-hd .hint{font-size:12px;color:var(--muted);font-weight:400;}

  /* ---------- Allocation accordion ---------- */
  .scroll{overflow:auto;max-height:calc(100vh - 290px);min-height:280px;overscroll-behavior:contain;}
  .p-row{border-bottom:1px solid var(--line);}
  .p-head{display:grid;grid-template-columns:var(--namecol,300px) 1fr;align-items:stretch;cursor:pointer;}
  :root{--namecol:340px;}
  .p-ident{display:flex;align-items:center;gap:10px;padding:10px 14px;min-width:0;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line);}
  .p-ident:hover{background:var(--surface-2);}
  .chev{width:14px;height:14px;color:var(--faint);transition:transform .18s;flex:0 0 auto;}
  .p-row.open .chev{transform:rotate(90deg);}
  .p-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .p-role{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .p-meta{min-width:0;}
  .badge{font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:5px;flex:0 0 auto;}
  .badge.emp{background:var(--accent-wash);color:var(--accent-ink);}
  .badge.contractor{background:var(--surface-3);color:var(--ink-2);border:1px solid var(--line-strong);}
  .badge.tbh{background:var(--tbh-wash);color:var(--tbh);}
  .badge.prj{background:var(--accent-wash);color:var(--accent-ink);}
  .badge.crm{background:var(--tbh-wash);color:var(--tbh);}
  .badge.np{background:var(--u-full-wash,#fbe9d0);color:var(--u-full-ink,#8a4b00);border:1px solid currentColor;cursor:help;}
  .np-map{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin:2px 0 6px;
    background:var(--u-full-wash,#fbe9d0);border:1px solid var(--u-full-ink,#8a4b00);border-radius:8px;}
  .np-map-t{font-size:12.5px;color:var(--u-full-ink,#8a4b00);font-weight:600;}
  .np-map select{max-width:340px;}
  .avatar{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:650;color:#fff;}

  .mgrid{display:grid;grid-template-columns:repeat(12,minmax(46px,1fr)) 62px;}
  .mgrid.head .mcell{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;background:var(--surface-2);position:sticky;top:0;}
  .mcell{padding:7px 4px;text-align:center;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .mcell .h{font-weight:640;font-size:12.5px;}
  .mcell .u{font-size:9.5px;opacity:.8;}
  .mcell.tot{background:var(--surface-2);font-weight:680;}
  .u-none{background:var(--u-none);color:var(--u-none-ink);}
  .u-under{background:var(--u-under);color:var(--u-under-ink);}
  .u-good{background:var(--u-good);color:var(--u-good-ink);}
  .u-full{background:var(--u-full);color:var(--u-full-ink);}
  .u-over{background:var(--u-over);color:var(--u-over-ink);}
  .u-orange{background:var(--u-orange);color:var(--u-orange-ink);}
  .u-greenx{background:var(--u-greenx);color:var(--u-greenx-ink);}

  .p-body{display:none;background:var(--surface-2);border-top:1px solid var(--line);}
  .p-row.open .p-body{display:block;}
  .cap-row{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .cap-row input{width:64px;padding:4px 7px;text-align:right;}
  .a-line{display:grid;grid-template-columns:var(--namecol,300px) 1fr;border-bottom:1px solid var(--line);}
  .a-proj{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:6px 14px 6px 30px;min-width:0;position:sticky;left:0;background:var(--surface-2);z-index:1;border-right:1px solid var(--line);}
  /* The name/client block owns the full first line (flex-basis 100% wraps the
     rate hint + controls onto their own line below), so long project names are
     no longer crushed by the controls. Both text lines truncate with an
     ellipsis; the full text lives in the row tooltip. */
  .a-proj>div:first-child{flex:1 1 100%;min-width:0;}
  .a-proj .pn{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .a-proj .cl{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .a-inputs{display:grid;grid-template-columns:repeat(12,minmax(46px,1fr)) 62px;}
  .a-inputs input{width:100%;height:100%;border:none;border-left:1px solid var(--line);background:transparent;
    text-align:center;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;padding:6px 2px;-moz-appearance:textfield;}
  .a-inputs input::-webkit-outer-spin-button,.a-inputs input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .a-inputs input:focus{background:var(--accent-wash);outline:none;}
  .a-inputs input:hover{background:var(--surface-3);}
  .a-inputs input.past{background:var(--surface-3);color:var(--muted);cursor:not-allowed;font-style:italic;}
  .a-inputs input.past:hover{background:var(--surface-3);}
  /* $ view: closed-month cells show actual dollars (hours × realized Odoo rate) as
     read-only text — same look as a locked past input, but text not an input. */
  .a-inputs .dcell{border-left:1px solid var(--line);background:var(--surface-3);color:var(--muted);font-style:italic;
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-variant-numeric:tabular-nums;padding:6px 2px;overflow:hidden;white-space:nowrap;}
  /* sticky per-month totals row at the bottom of the Allocate grids */
  .grid-totrow{position:sticky;bottom:0;z-index:6;}
  .grid-totrow .p-head{background:var(--surface-2);border-top:2px solid var(--line-strong);}
  .grid-totrow .p-ident,.grid-totrow .mcell{background:var(--surface-2);}
  .grid-totrow .mcell .h{font-weight:700;}
  .grid-totrow .p-ident{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;align-items:center;}
  /* proposed-hire name per (TBA pool × project) */
  .prophire input{width:150px;border:1px dashed var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink);
    font:inherit;font-size:11px;padding:2px 6px;margin-top:3px;font-weight:400;}
  .prophire input::placeholder{color:var(--faint);font-style:italic;}
  .prophire input:focus{outline:none;border-color:var(--accent);border-style:solid;}
  body.viewer .prophire input{pointer-events:none;background:var(--surface-3);color:var(--muted);}
  /* latest actual realized rate, shown beside the (forecast) rate input */
  .actrate{font-size:10px;color:var(--muted);white-space:nowrap;}
  .a-proj .actrate{margin-left:auto;}
  .a-proj .actrate~.prate{margin-left:8px;}
  .mgrid.head .mcell.actual{color:var(--accent-ink);}
  .mgrid.head .mcell .actflag{font-size:7.5px;letter-spacing:.02em;opacity:.75;font-weight:600;text-transform:uppercase;line-height:1;}
  table.pivot thead th.actual{color:var(--accent-ink);}
  .a-inputs .rowtot{border-left:1px solid var(--line);background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:640;font-size:12px;}
  .rm{margin-left:auto;border:none;background:transparent;color:var(--faint);padding:2px 4px;border-radius:5px;font-size:14px;line-height:1;}
  .rm:hover{color:var(--u-over-ink);background:var(--u-over);}
  .addproj{padding:8px 14px 10px 30px;}
  .addproj select{max-width:340px;}
  .empty-body{padding:10px 30px;color:var(--muted);font-size:12px;}

  /* ---------- Pivot tables ---------- */
  table.pivot{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.pivot th,table.pivot td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:right;white-space:nowrap;}
  table.pivot thead th{position:sticky;top:0;background:var(--surface-2);z-index:3;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;}
  table.pivot th.lbl,table.pivot td.lbl{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line);min-width:210px;}
  table.pivot thead th.lbl{z-index:4;background:var(--surface-2);}
  table.pivot tbody tr:hover td{background:var(--surface-2);}
  table.pivot tbody tr:hover td.lbl{background:var(--surface-2);}
  table.pivot td.mcelln{font-variant-numeric:tabular-nums;font-weight:560;line-height:1.2;}
  table.pivot td.mcelln .h{display:block;font-weight:640;}
  table.pivot td.mcelln .pct{display:block;font-size:9.5px;font-weight:500;opacity:.72;letter-spacing:.01em;white-space:nowrap;}
  /* month-over-month change in utilization (percentage points) */
  table.pivot td.mcelln .dlt{font-style:normal;font-size:8.5px;font-weight:700;margin-left:2px;opacity:.85;}
  /* variance tab: two columns per month (Fcst | Act) under a grouped header.
     Both header rows are sticky; the sub-row offsets by the first row's fixed
     height so they stack instead of overlapping. */
  table.pivot thead tr.mhd th{padding:5px 8px;line-height:14px;}
  table.pivot thead tr.subhd th{top:25px;font-size:9px;padding:3px 6px;}
  table.pivot td.fcst,table.pivot th.mgrp{border-left:1px solid var(--line-strong);}
  table.pivot td.fcst{color:var(--muted);}
  table.pivot td.mtd .h{color:var(--ink-2);}
  table.pivot td.mtd .pct{opacity:.6;}
  /* forecast-vs-actual variance shading: on-plan (green), over (amber), under (blue) */
  table.pivot td.v-on{background:var(--u-good);} table.pivot td.v-on .h{color:var(--u-good-ink);}
  table.pivot td.v-over{background:var(--u-orange);} table.pivot td.v-over .h{color:var(--u-orange-ink);}
  table.pivot td.v-under{background:var(--u-under);} table.pivot td.v-under .h{color:var(--u-under-ink);}
  table.pivot td.v-zero .h{color:var(--muted);}
  .legend .box.v-on{background:var(--u-good);} .legend .box.v-over{background:var(--u-orange);} .legend .box.v-under{background:var(--u-under);}
  .kpi .val .kdlt{font-size:11.5px;font-weight:650;margin-left:7px;letter-spacing:0;vertical-align:middle;}
  .kdlt.up{color:var(--u-good-ink);}
  .kdlt.down{color:var(--u-over-ink);}
  table.pivot tr.grp td{background:var(--surface-3);font-weight:680;color:var(--ink);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;}
  table.pivot tr.grp td.lbl{background:var(--surface-3);}
  table.pivot tfoot td{background:var(--surface-2);font-weight:620;}
  table.pivot tfoot td.lbl{background:var(--surface-2);}
  table.pivot tfoot tr:first-child td{border-top:2px solid var(--line-strong);}
  table.pivot tfoot tr.grand td{font-weight:700;border-top:1px solid var(--line-strong);background:var(--surface-3);}
  table.pivot tfoot tr.grand td.lbl{background:var(--surface-3);}
  .col-tot{border-left:1px solid var(--line-strong)!important;font-weight:680;}
  .pill{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;font-weight:640;font-variant-numeric:tabular-nums;}
  .subrow td.lbl{padding-left:30px;font-weight:400;color:var(--ink-2);}
  /* By Role drill-down: role → practice → person */
  table.pivot tr[data-role] td.lbl,table.pivot tr[data-rp] td.lbl,table.pivot tr[data-cust] td.lbl{cursor:pointer;user-select:none;}
  table.pivot tr[data-role] td.lbl:hover,table.pivot tr[data-rp] td.lbl:hover,table.pivot tr[data-cust] td.lbl:hover{color:var(--accent-ink);}
  table.pivot tr.lvl2 td{background:var(--surface-2);}
  table.pivot tr.lvl2 td.lbl{background:var(--surface-2);}
  table.pivot tr.lvl3 td{background:var(--surface-3);}
  table.pivot tr.lvl3 td.lbl{background:var(--surface-3);font-weight:400;color:var(--ink-2);}
  table.pivot td.lbl.lvl2i{padding-left:24px;}
  table.pivot td.lbl.lvl3i{padding-left:52px;}
  .tw{display:inline-flex;width:14px;}
  .twchev{width:11px;height:11px;color:var(--faint);transition:transform .16s;}
  tr.open > td.lbl .twchev{transform:rotate(90deg);color:var(--accent);}
  .gaptag{font-size:11px;font-weight:650;padding:1px 6px;border-radius:5px;}

<script>
/* ============================ SEED DATA (live Odoo snapshot 2026-07-13) ============================ */
const DATA_DATE = "2026-07-16";   // refreshed from Odoo
const YEAR = 2026;              // calendar-year axis, aligned to the CY26 forecast workbook
/* The forecast/actuals boundary follows the real clock — it used to be a
   hardcoded month, which left July editable into August. */
const NOW = new Date();
const CURRENT_KEY = `${NOW.getFullYear()}-${String(NOW.getMonth()+1).padStart(2,"0")}`;




/* Reference data comes from the API (Postgres, synced read-only from Odoo).
   These start empty and are filled by bootstrap() before the first render. */
let PEOPLE = [], PROJECTS = [], CRM_PROJECTS = [], ALL_PROJECTS = [];
let ACTUALS = new Map();          // "empId|projId|YYYY-MM" -> hours (closed months, read-only)
let ACT_PERSON_PROJ = new Map();  // "empId" -> Set of projId (strings) they logged actuals on
let ACT_RATES = new Map();        // "empId|projId|YYYY-MM" -> actual realized $/hr from Odoo (billable rev / billable hrs)
let SYNC = [];                    // ref_* freshness, shown in the footer
function rebuildProjects(){ ALL_PROJECTS = PROJECTS.concat(CRM_PROJECTS); }
function projRank(p){ return p.src==="CRM" ? 1 : 0; }                       // PRJ first, CRM second
function projLabel(p){ return (p.src==="CRM" ? "CRM - " : "PRJ - ") + p.name; }
/* Badge for a closed CRM opp whose forecast could not be matched to a project yet.
   The forecast stays put and re-matches on the next Odoo sync. */
function npBadge(p){ return p && p.needsProject ? ` <span class="badge np" title="This opportunity has closed in Odoo, but the sync found no matching delivery project. Its forecast stays here and will move to the project automatically on the next sync once a match is found.">needs project</span>` : ""; }

/* ---- CRM window cross-check: does the planner forecast agree with the CRM's
   expected start date and projected number of months? -------------------------
   Rules (confirmed): forecast length counts DISTINCT months with hours (gaps
   don't count); opportunities with no expected start or 0 projected months are
   skipped; the Odoo window is clipped to the planner's calendar year before
   comparing, and a window entirely outside the year treats ANY forecast as a
   start mismatch. CRM targets never have actuals, so the plan alone is read. */
function crmForecastMonths(projid){
  const set=new Set();
  for(const pid in state.alloc){ const a=state.alloc[pid][projid]; if(!a) continue;
    for(const mk in a){ if(a[mk]>0) set.add(mk); } }
  return [...set].sort();
}
const monLabel=k=>{ const m=MONTHS.find(x=>x.key===k); return m?m.label:k; };
/* Stages close enough to winning that the pipeline should already be staffed. */
const LATE_STAGE_RX=/^(propose|negotiate)$/i;
function crmMismatch(pr){
  if(pr.src!=="CRM") return null;
  const fm=crmForecastMonths(pr.id);
  // Clip the CRM window to the planner's year (when the CRM has one at all).
  const hasWindow = !!pr.expectedStart && pr.expectedMonths>0;
  let visStart=null, visLen=null, outside=false;
  if(hasWindow){
    const [ey,em]=pr.expectedStart.split("-").map(Number);
    const s=ey*12+(em-1), e=s+pr.expectedMonths-1;           // absolute month window from CRM
    const y0=YEAR*12, y1=YEAR*12+11;                         // planner's visible year
    const cs=Math.max(s,y0), ce=Math.min(e,y1);
    if(cs>ce) outside=true;
    else { visStart=`${Math.floor(cs/12)}-${String(cs%12+1).padStart(2,"0")}`; visLen=ce-cs+1; }
  }
  const out={expStart:pr.expectedStart||null, expMonths:pr.expectedMonths||0, visStart, visLen,
             fStart:fm[0]||null, fLen:fm.length, fHours:0};
  for(const pid in state.alloc){ const a=state.alloc[pid][pr.id]; if(a) for(const mk in a) out.fHours+=a[mk]||0; }
  if(!fm.length){
    // No forecast at all: fine for early pipeline, a gap for Propose/Negotiate.
    if(LATE_STAGE_RX.test((pr.stage||"").trim())){ out.missingFlag=true; return out; }
    return null;
  }
  if(!hasWindow) return null;                                // window checks need CRM data — skip
  if(outside){ out.startFlag=true; return out; }             // window entirely outside this year
  out.startFlag = fm[0]!==visStart;
  out.lenFlag = fm.length!==visLen;
  return (out.startFlag||out.lenFlag)? out : null;
}
function mmBadge(pr){
  const m=pr.src==="CRM"? crmMismatch(pr) : null; if(!m) return "";
  let b="";
  if(m.missingFlag) b+=` <span class="badge np" title="This opportunity is in ${esc(pr.stage)} but has no forecast in the planner — late-stage pipeline should be staffed">missing forecast</span>`;
  if(m.startFlag) b+=` <span class="badge np" title="Forecast starts ${monLabel(m.fStart)}, but the CRM expects ${m.visStart?monLabel(m.visStart):"no start this year (CRM start "+esc(m.expStart)+")"}">start ≠ CRM</span>`;

  return b;
}

/* ============================ MONTHS ============================ */
const MONTHS = (() => {
  const NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const out=[];
  for(let m=0;m<12;m++){
    out.push({key:YEAR+"-"+String(m+1).padStart(2,"0"), label:NAMES[m]+" '"+String(YEAR).slice(2), name:NAMES[m], year:YEAR, mi:m});
  }
  return out;
})();
const MKEYS = MONTHS.map(m=>m.key);
/* Index of the current month within the planner's year; months before it are
   "past" (locked actuals). Clamped for year boundaries: before the planner year
   nothing is past, after it everything is. */
const CURRENT_MI = NOW.getFullYear()>YEAR ? 12 : NOW.getFullYear()<YEAR ? 0 : NOW.getMonth();
const isPastMi = mi => mi < CURRENT_MI;
/* "Jan–Jul are actual hours (locked) · Aug–Dec are editable forecast", kept true
   as the boundary moves each month. */
function boundaryLabel(){
  if(CURRENT_MI<=0) return "all months are editable forecast";
  if(CURRENT_MI>=12) return "all months are locked actuals";
  return `${MONTHS[0].name}–${MONTHS[CURRENT_MI-1].name} are actual hours (locked) · ${MONTHS[CURRENT_MI].name}–${MONTHS[11].name} are editable forecast`;
}

/* The plan lives in Postgres. This is a local mirror kept in step with the server:
   every edit is PUT immediately and carries the version it was read at, so a stale
   write is rejected rather than silently overwriting a colleague. */
const MATCH_V=2;   // bump when the auto-matcher changes — invalidates remembered mappings
let ME = { upn:"", name:"", canEdit:false, canImport:false };
let state = { alloc:{}, capacity:{}, rates:{}, tbh:[], proposed:{}, theme:null, viewMode:"hours", importMap:{people:{},projects:{},v:MATCH_V}, lastImport:null };
let VER = {};                      // "resourceKey|targetKey|YYYY-MM" -> version last seen from the server
let RATE_VER = {};                 // "resourceKey|targetKey" -> bill-rate version last seen from the server

/* ---- id <-> API key mapping -------------------------------------------------
   The UI keys people/projects by their Odoo id (or a tbh-/crm- prefixed string);
   the API keys them 'emp:110' | 'tbh:x' and 'prj:119' | 'crm:222'. */
const resKey = (pid) => String(pid).startsWith("tbh") ? `tbh:${String(pid).replace(/^tbh-?/,"")}` : `emp:${pid}`;
const tgtKey = (jid) => String(jid).startsWith("crm-") ? `crm:${String(jid).slice(4)}` : `prj:${jid}`;
const fromResKey = (k) => k.startsWith("tbh:") ? "tbh-"+k.slice(4) : k.slice(4);
const fromTgtKey = (k) => k.startsWith("crm:") ? "crm-"+k.slice(4) : k.slice(4);
const verKey = (pid,jid,mk) => `${resKey(pid)}|${tgtKey(jid)}|${mk}`;

let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); if(!t) return; t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3200); }
function status(msg){ const el=document.getElementById("saveState"); if(el) el.textContent=msg; }

/* ---- API ------------------------------------------------------------------- */
async function api(method, path, body){
  const res = await fetch(path, {
    method,
    headers: body ? {"content-type":"application/json"} : undefined,
    body: body ? JSON.stringify(body) : undefined,
    credentials: "same-origin",
  });
  if (res.status === 401){ location.href = "/auth/login?returnTo=" + encodeURIComponent(location.pathname); throw new Error("signed out"); }
  const data = await res.json().catch(()=>({}));
  if (!res.ok){ const e = new Error(data.error || `${method} ${path} failed (${res.status})`); e.status=res.status; e.data=data; throw e; }
  return data;
}

let capVer = {};                   // resource id -> capacity-override version

/* Write many cells at once (bulk allocate, forecast import). The server applies
   the batch atomically, so a conflict mid-way leaves nothing half-applied. */
async function pushBatch(items, okMsg, extra){
  if(!items.length) return true;
  try{
    status("Saving…");
    const r = await api("POST","/api/allocations",{ items, ...(extra||{}) });
    (r.results||[]).forEach((res,i)=>{
      const it=items[i]; const k=`${it.resourceKey}|${it.targetKey}|${it.month}`;
      if(res && res.deleted) delete VER[k]; else if(res && res.version) VER[k]=res.version;
    });
    status("Saved"); if(okMsg) toast(okMsg);
    return true;
  }catch(e){
    status("Save failed");
    toast(e.status===409
      ? "Someone else changed part of this while you were working — nothing was saved. Reloading."
      : "Not saved: "+e.message);
    if(e.status===409) setTimeout(()=>bootstrap(),1200);   // resync to the server's truth
    return false;
  }
}

/* Persist one cell. Returns true if the server accepted it. On a 409 the server
   tells us the winning value, so we show what we lost to instead of clobbering. */
async function pushAllocation(pid, jid, mk, hours){
  const k = verKey(pid,jid,mk);
  try{
    status("Saving…");
    const r = await api("PUT","/api/allocation",{
      resourceKey:resKey(pid), targetKey:tgtKey(jid), month:mk, hours, version:VER[k]||0 });
    if (r.deleted) delete VER[k]; else VER[k]=r.version;
    status("Saved");
    return true;
  }catch(e){
    if (e.status === 409){
      const cur = e.data && e.data.current;
      if (cur){ setAlloc(pid,jid,mk,cur.hours); VER[k]=cur.version; }
      else { delete VER[k]; }
      status("Conflict");
      toast(`Someone else changed that cell — it is now ${cur?cur.hours:0}h. Your value was not saved.`);
      render();
    } else {
      status("Save failed");
      toast(e.message);
    }
    return false;
  }
}

/* Persist one pair's bill rate. Mirrors pushAllocation's concurrency contract. */
async function pushRate(pid, jid, rate){
  const k = `${resKey(pid)}|${tgtKey(jid)}`;
  try{
    status("Saving…");
    const r = await api("PUT","/api/rate",{ resourceKey:resKey(pid), targetKey:tgtKey(jid), rate, version:RATE_VER[k]||0 });
    if (r.deleted) delete RATE_VER[k]; else RATE_VER[k]=r.version;
    status("Saved");
    return true;
  }catch(e){
    if (e.status === 409){
      const cur = e.data && e.data.current;
      if (cur){ setPairRateLocal(pid,jid,cur.rate); RATE_VER[k]=cur.version; }
      else { setPairRateLocal(pid,jid,0); delete RATE_VER[k]; }
      status("Conflict");
      toast(`Someone else changed that bill rate — it is now $${cur?cur.rate:0}/hr. Your value was not saved.`);
      render();
    } else {
      status("Save failed");
      toast(e.message);
    }
    return false;
  }
}

/* ============================ HELPERS ============================ */
function allPeople(){ return PEOPLE.concat(state.tbh); }
function personById(id){ return allPeople().find(p=>String(p.id)===String(id)); }
function projById(id){ return ALL_PROJECTS.find(p=>String(p.id)===String(id)); }
function capOf(p,mkey){
  // TBA role pools are demand-only: unassigned hours against a role, with no
  // capacity of their own. Whether the org can absorb them is answered by the
  // role's available-capacity lines on the To Be Assigned tab.
  if(p.type==="tbh") return 0;
  const ov=state.capacity[p.id];
  return (ov===undefined||ov===null||ov==="")? (p.cap||DEFAULT_CAP) : Number(ov);
}
/* Closed months read from the Odoo actuals overlay, never from the plan: past
   hours are a fact, not a forecast, so they are never stored as allocations. */
function alloc(pid,projid,mkey){
  const mi = MONTHS.findIndex(m=>m.key===mkey);
  if(mi>=0 && isPastMi(mi)) return ACTUALS.get(`${pid}|${projid}|${mkey}`) || 0;
  return (state.alloc[pid] && state.alloc[pid][projid] && state.alloc[pid][projid][mkey]) || 0;
}
function setAlloc(pid,projid,mkey,val){
  if(!state.alloc[pid]) state.alloc[pid]={};
  if(!state.alloc[pid][projid]) state.alloc[pid][projid]={};
  if(val>0) state.alloc[pid][projid][mkey]=val; else delete state.alloc[pid][projid][mkey];
}
/* A person's projects = their forecast projects (state.alloc) UNION the projects
   they logged actuals on in past months. Actuals live in an overlay, not in the
   plan, so without this union the Person view showed blank past months even though
   the Project view (which sums through alloc()) showed the hours. */
function personProjects(pid){
  const ids = new Set(state.alloc[pid] ? Object.keys(state.alloc[pid]) : []);
  const ap = ACT_PERSON_PROJ.get(String(pid)); if(ap) ap.forEach(x=>ids.add(x));
  return [...ids];
}
function personMonthTotal(pid,mkey){
  // alloc() returns actuals for past months and forecast for the rest, so this is
  // correct in both — unlike reading state.alloc directly, which misses actuals.
  return personProjects(pid).reduce((t,proj)=>t+alloc(pid,proj,mkey),0);
}
function utilClass(hours,cap){
  if(!cap) return hours>0? "u-greenx":"u-none";
  if(hours===0) return "u-none";
  const r=hours/cap;
  if(r<0.60) return "u-over";      // <60%  → red (under-utilized)
  if(r<0.75) return "u-full";      // 60–75% → yellow
  if(r<=1.00) return "u-good";     // 75–100% → green (ideal)
  return "u-greenx";               // >100% → darker green (fully/over-loaded)
}
function initials(n){ return n.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function deptColor(d){ const map={"Operations":"#0f7f8c","AI":"#8a5cf6","Business Advisory":"#c2683a","Delivery":"#2f6fb0","Sales & Marketing":"#1f9d6b","Contractor":"#8794a3"}; return map[d]||"#8794a3"; }
function deptLabel(d){ return d || "Unassigned"; }                 // blank/unknown dept → "Unassigned"
function deptRank(d){ const i=DEPTS.indexOf(d); return i<0 ? DEPTS.length + (d?0:1) : i; } // listed depts first, unlisted next, blank last
function deptsInOrder(people){                                     // every dept actually present, ordered; includes "" (Unassigned)
  const present=[...new Set(people.map(p=>p.dept||""))];
  return present.sort((a,b)=>deptRank(a)-deptRank(b)||a.localeCompare(b));
}
function fmt(n){ return n? (Math.round(n*10)/10).toLocaleString():""; }
function fmt0(n){ return n? Math.round(n).toLocaleString():"0"; }

/* ---------- Bill rates (per person × project) & hours/dollars display mode ---------- */
function pairRate(pid,projid){ const r=state.rates[pid]; const v=r&&r[projid]; return (v===undefined||v===null||v==="")?0:Number(v)||0; }
function setPairRateLocal(pid,projid,rate){
  if(!state.rates[pid]) state.rates[pid]={};
  if(rate>0) state.rates[pid][projid]=rate;
  else { delete state.rates[pid][projid]; if(!Object.keys(state.rates[pid]).length) delete state.rates[pid]; }
}
/* Month-aware rate: closed months use the ACTUAL realized rate synced from Odoo
   (billable revenue / billable hours on that person × project × month); open
   months use the manually-entered forecast rate. */
function rateAt(pid,projid,mkey){
  const mi=MONTHS.findIndex(m=>m.key===mkey);
  if(mi>=0 && isPastMi(mi)){ const r=ACT_RATES.get(`${pid}|${projid}|${mkey}`); return r||0; }
  return pairRate(pid,projid);
}
function personMonthDollars(pid,mkey){
  return personProjects(pid).reduce((t,proj)=>t+alloc(pid,proj,mkey)*rateAt(pid,proj,mkey),0);
}
function personDollars(pid){ return MKEYS.reduce((s,k)=>s+personMonthDollars(pid,k),0); }
function lineDollars(pid,projid){ return MKEYS.reduce((s,k)=>s+alloc(pid,projid,k)*rateAt(pid,projid,k),0); }
function isD(){ return state.viewMode==="dollars"; }
function money(n){ return "$"+Math.round(n||0).toLocaleString(); }
// Format an hours/dollars pair; the "has data" signal is the underlying hours.
function fmtHD(h,d){ if(!h) return ""; return isD()? money(d) : fmt(h); }
function fmtHD0(h,d){ return isD()? money(d) : fmt0(h); }

/* ============================ FILTERS ============================ */
const F={search:"",dept:"all",type:"all"};
function passFilter(p){
  if(F.type!=="all" && p.type!==F.type) return false;
  if(F.dept!=="all"){
    if(F.dept==="__none__"){ if(p.dept && DEPTS.includes(p.dept)) return false; }  // Unassigned = blank or unlisted dept
    else if(p.dept!==F.dept) return false;
  }
  if(F.search){ const s=F.search.toLowerCase(); if(!(p.name.toLowerCase().includes(s)||(p.role||"").toLowerCase().includes(s)||(p.dept||"").toLowerCase().includes(s))) return false; }
  return true;
}
function filteredPeople(){
  return allPeople().filter(passFilter).sort((a,b)=>{
    const d=deptRank(a.dept||"")-deptRank(b.dept||""); if(d) return d;
    return a.name.localeCompare(b.name);
  });
}

/* ============================ KPIs ============================ */
function renderKpis(){
  // KPIs follow the department dropdown: with a department selected, every
  // card is computed over that department's people only (same semantics as the
  // row filter, incl. "Unassigned"). "all" keeps the whole-company view.
  const inDept=p=> F.dept==="all" ? true
    : F.dept==="__none__" ? !(p.dept && DEPTS.includes(p.dept))
    : p.dept===F.dept;
  const deptTag=F.dept==="all" ? "" : " · "+(F.dept==="__none__" ? "Unassigned" : esc(F.dept));
  const ppl=allPeople().filter(inDept);
  const emp=PEOPLE.filter(p=>p.type==="employee").filter(inDept).length;
  const con=PEOPLE.filter(p=>p.type==="contractor").filter(inDept).length;
  const tbh=state.tbh.filter(inDept).length;
  const cur=CURRENT_KEY; const curM=MONTHS.find(m=>m.key===cur)||MONTHS[0];
  // allocated vs capacity, kept separate for employees and contractors (blending them distorts both)
  const sumFor=(type,mk)=>{ let a=0,c=0,ad=0;
    ppl.filter(p=>p.type===type).forEach(p=>{ a+=personMonthTotal(p.id,mk); c+=capOf(p,mk); ad+=personMonthDollars(p.id,mk); });
    return {a,c,ad,u:c?Math.round(a/c*100):0,cls:utilClass(a,c).replace("u-","uv-")}; };
  const prevM = CURRENT_MI>0 ? MONTHS[CURRENT_MI-1] : null;
  const E=sumFor("employee",cur), C=sumFor("contractor",cur);
  const Ep=prevM? sumFor("employee",prevM.key):null, Cp=prevM? sumFor("contractor",prevM.key):null;
  // month-over-month change in utilization, in percentage points
  const mom=(now,prev)=>{ if(!prev||!prev.c) return ""; const d=now.u-prev.u; if(!d) return "";
    return `<span class="kdlt ${d>0?"up":"down"}">${d>0?"▲":"▼"}${Math.abs(d)} pts</span>`; };
  const vsPrev = prevM? ` · vs ${prevM.label}` : "";
  // count over-allocated people this month
  let over=0; ppl.forEach(p=>{ const c=capOf(p,cur); if(c && personMonthTotal(p.id,cur)>c*1.10) over++; });
  // Projects: company-wide by default; with a department selected, the distinct
  // projects/opportunities that department's people are staffed on.
  let projVal=ALL_PROJECTS.length, projMeta=PROJECTS.length+" PRJ · "+CRM_PROJECTS.length+" CRM pipeline";
  if(F.dept!=="all"){
    const ids=new Set();
    ppl.forEach(p=>personProjects(p.id).forEach(id=>{ if(projById(id)) ids.add(String(id)); }));
    const crm=[...ids].filter(x=>x.startsWith("crm-")).length;
    projVal=ids.size; projMeta=`${ids.size-crm} PRJ · ${crm} CRM · staffed by this dept`;
  }
  const kpi=[
    {label:"People"+deptTag,val:emp+con+tbh,meta:emp+" emp · "+con+" contractor"+(tbh?" · "+tbh+" TBA":"")},
    {label:"Projects"+deptTag,val:projVal,meta:projMeta},
    {label:curM.label+" · employees"+deptTag,val:E.u+"%"+mom(E,Ep),cls:E.cls,meta:(isD()? money(E.ad)+" forecast · "+fmt0(E.a)+"h of "+fmt0(E.c)+"h" : fmt0(E.a)+"h of "+fmt0(E.c)+"h capacity")+vsPrev},
    {label:curM.label+" · contractors"+deptTag,val:C.u+"%"+mom(C,Cp),cls:C.cls,meta:(isD()? money(C.ad)+" forecast · "+fmt0(C.a)+"h of "+fmt0(C.c)+"h" : fmt0(C.a)+"h of "+fmt0(C.c)+"h capacity")+vsPrev},
    {label:"Attention"+deptTag,val:over,meta:over===1?"person over-allocated":"people over-allocated"},
  ];
  document.getElementById("kpis").innerHTML=kpi.map(k=>
    `<div class="kpi"><div class="label">${k.label}</div><div class="val tnum ${k.cls||""}">${k.val}${k.unit?` <small>${k.unit}</small>`:""}</div><div class="meta">${k.meta}</div></div>`).join("");
}

    `<div class="p-ident" style="background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;align-items:center">Name · role</div>`+
    monthHeadRow()+`</div>`;
  if(!ppl.length) html+=`<div class="empty-body" style="padding:24px">No people match the current filters.</div>`;
  ppl.forEach(p=>{ html+=personRow(p); });
  if(ppl.length){ const t=allocTotals(ppl); html+=totalsRowHtml(`Total · ${ppl.length} people`, t.perMonth, t.grand); }
  html+=`</div></div>`;
  html+=legend();
  html+=`</div>`;
  document.getElementById("viewRoot").innerHTML=html;
}
function personRow(p){

function personBody(p){
  const projs= sortProjIds(personProjects(p.id));   // forecast + actual projects, PRJ first then CRM
  const capVal = state.capacity[p.id]!==undefined? state.capacity[p.id] : "";
  let rows= projs.length? projs.map(pid=>allocLine(p,pid)).join("")
    : `<div class="empty-body">No projects yet — add one below.</div>`;
  const avail=sortedProjects().filter(pr=>!projs.includes(String(pr.id)));
  const opts=avail.map(pr=>`<option value="${pr.id}">${esc(projLabel(pr))}${pr.client&&pr.client!=="Internal"?" · "+esc(pr.client):""}</option>`).join("");
  return (p.type==="tbh"
    // A TBA role pool is demand-only — no capacity of its own, so no capacity input.
    ? `<div class="cap-row"><span class="muted">To-Be-Assigned role pool — unassigned demand for ${esc(p.role||"this role")}; see the To Be Assigned tab for the role's available capacity</span>`+
      `<button class="btn" data-deltbh="${p.id}" style="margin-left:auto;padding:4px 9px">Remove pool</button></div>`
    : `<div class="cap-row"><span>Monthly capacity</span>`+
      `<input type="number" min="0" step="1" placeholder="${DEFAULT_CAP}" value="${capVal}" data-cap="${p.id}"> h`+
      `<span class="muted">· default ${DEFAULT_CAP}h</span>`+
    `</div>`)+
    rows+
    `<div class="addproj"><select data-addproj="${p.id}"><option value="">+ Add project…</option>${opts}</select></div>`;
}
/* One month cell on a person×project line. Hours mode: always the hour input.
   $ mode: closed months become read-only dollar text (hours × actual Odoo rate) —
   they're locked anyway, and it gives the per-project monthly $ breakdown; open
   months stay hour inputs (the $ totals derive from the forecast rate). */
function lineCell(pid,projid,m,label){
  const v=alloc(pid,projid,m.key), past=isPastMi(m.mi);
  if(past && isD()){
    const r=ACT_RATES.get(`${pid}|${projid}|${m.key}`)||0, d=v*r;
    return `<div class="dcell" title="${v?`${fmt(v)}h actual × $${fmt(r)}/hr${r?"":" (nothing billed)"}`:"no actual hours"}">${v?money(d):""}</div>`;
  }
  return `<input type="number" inputmode="numeric" min="0" step="1" value="${v||""}"${past?' readonly class="past" title="Actual timesheet hours"':''} data-a="${pid}|${projid}|${m.key}" aria-label="${label} ${m.label}${past?" (actual)":""}">`;
}
/* Latest closed-month actual rate for a pair, for the "act $X/hr" hint. */
function lastActRate(pid,projid){
  for(let i=CURRENT_MI-1;i>=0;i--){ const r=ACT_RATES.get(`${pid}|${projid}|${MKEYS[i]}`); if(r) return {rate:r,mon:MONTHS[i].name}; }
  return null;
}
function actRateHint(pid,projid){
  const a=lastActRate(pid,projid);
  return a? `<span class="actrate" title="Actual realized rate from Odoo (latest closed month with billed hours)">act $${fmt(a.rate)}/hr · ${a.mon}</span>` : "";
}
function allocLine(p,projid){
  const pr=projById(projid); if(!pr) return "";
  const inputs=MONTHS.map(m=>lineCell(p.id,projid,m,pr.name)).join("");
  const rt=MKEYS.reduce((s,k)=>s+alloc(p.id,projid,k),0);
  const pr8=pairRate(p.id,projid);
  return `<div class="a-line" data-line="${p.id}:${projid}">`+
    `<div class="a-proj"><div style="min-width:0"><div class="pn" title="${esc(projLabel(pr))}${pr.client?" · "+esc(pr.client):""}${pr.src==="CRM"&&pr.stage?" · "+esc(pr.stage):""}">${esc(projLabel(pr))}${npBadge(pr)}${mmBadge(pr)}</div>`+
      `<div class="cl">${esc(pr.client||"")}${pr.src==="CRM"&&pr.stage?" · "+esc(pr.stage):""}${p.type==="tbh"&&proposedFor(p.id,projid)?` · <b>proposed: ${esc(proposedFor(p.id,projid))}</b>`:""}</div></div>`+
      actRateHint(p.id,projid)+
      `<span class="prate" title="Forecast bill rate for ${esc(p.name)} on this project ($/hr) — closed months use the actual rate from Odoo">$<input type="number" min="0" step="1" placeholder="0" value="${pr8||""}" data-prate="${p.id}|${projid}">/hr</span>`+
      `<button class="btn" data-xfer="${p.id}|${projid}" style="font-size:10px;padding:2px 7px;margin-left:6px;flex:none" title="Transfer all or part of these hours to another person or TBA pool…">⇄</button>`+
      `<button class="rm" data-rmproj="${p.id}|${projid}" title="Remove project" aria-label="Remove">×</button></div>`+
    `<div class="a-inputs">${inputs}<div class="rowtot" data-rt="${p.id}:${projid}">${rt?fmtHD0(rt,lineDollars(p.id,projid)):""}</div></div>`+
  `</div>`;
}
function legend(){
  return `<div class="legend"><span>Utilization</span>`+
    `<span class="sw"><span class="box u-over"></span>&lt;60% low</span>`+
    `<span class="sw"><span class="box u-full"></span>60–75%</span>`+
    `<span class="sw"><span class="box u-good"></span>75–100%</span>`+

/* live update after typing (no re-render, keeps focus) */
function refreshPersonSummary(pid){
  const p=personById(pid); if(!p) return;
  MONTHS.forEach(m=>{
    const h=personMonthTotal(pid,m.key), c=capOf(p,m.key);

function refreshRowTotal(pid,projid){

/* ============================ PIVOT: BY EMPLOYEE ============================ */
/* pivot cell: hours on top, utilization % beneath, with the month-over-month change in
   percentage points embedded next to it (pu = previous month's utilization %, or null). */
/* dh: pre-summed dollar equivalent for the group (display only, from per-project rates).
   Utilization % and shading always come from hours vs capacity, whichever mode is shown. */
function hpCell(h,c,cls,extra,pu,dh){
  const u = c ? Math.round(h/c*100) : null;
  const d = (h && u!==null && pu!==null && pu!==undefined) ? u-Math.round(pu) : 0;
  const dlt = d ? `<em class="dlt">${d>0?"▲":"▼"}${Math.abs(d)}</em>` : "";
  const shown = isD()? money(dh||0) : fmt(h);
  const inner = h ? `<span class="h">${shown}</span><span class="pct">${u!==null?u+"%":""}${dlt}</span>` : "";
  const tip = (isD()? `${money(dh||0)} · ${fmt0(h)}h of ${fmt0(c)}h capacity` : `${fmt0(h)}h of ${fmt0(c)}h capacity`) + (d? ` · ${d>0?"+":""}${d} pts vs previous month` : "");
  return `<td class="mcelln ${cls||""}${extra?" "+extra:""}" title="${tip}">${inner}</td>`;
}
const utilPct=(h,c)=> c ? Math.round(h/c*100) : null;
function pivotHead(firstLabel){
  return `<thead><tr><th class="lbl">${firstLabel}</th>`+
    MONTHS.map(m=>`<th class="${isPastMi(m.mi)?"actual":""}">${m.label}</th>`).join("")+`<th class="col-tot">Total</th></tr></thead>`;
}
function renderByEmp(){
  const ppl=filteredPeople();
  const colTot=MKEYS.map(()=>0), colCap=MKEYS.map(()=>0), colD=MKEYS.map(()=>0);
  let grand=0, grandCap=0, grandD=0;
  // allocated-vs-capacity kept separate per person type (d = dollar equivalents from per-project rates)
  const mkAcc=()=>({t:MKEYS.map(()=>0), c:MKEYS.map(()=>0), d:MKEYS.map(()=>0), g:0, gc:0, gd:0, n:0});
  const acc={employee:mkAcc(), contractor:mkAcc(), tbh:mkAcc()};
  const byDept={};
  ppl.forEach(p=>{ const d=p.dept||""; (byDept[d]=byDept[d]||[]).push(p); });
  let body="";
  deptsInOrder(ppl).forEach(d=>{ if(!byDept[d]) return;
    body+=`<tr class="grp"><td class="lbl">${deptLabel(d)}</td>`+MONTHS.map(()=>`<td></td>`).join("")+`<td class="col-tot"></td></tr>`;
    byDept[d].forEach(p=>{
      let rt=0, rcap=0, rd=0, pu=null;
      const a=acc[p.type]||acc.employee; a.n++;
      const tds=MONTHS.map((m,i)=>{ const h=personMonthTotal(p.id,m.key), c=capOf(p,m.key), dol=personMonthDollars(p.id,m.key);
        rt+=h; rcap+=c; rd+=dol; colTot[i]+=h; colCap[i]+=c; colD[i]+=dol; a.t[i]+=h; a.c[i]+=c; a.d[i]+=dol;
        const cell=hpCell(h,c,utilClass(h,c),"",pu,dol); pu=utilPct(h,c);   // carry this month's % into the next
        return cell;
      }).join("");
      grand+=rt; grandCap+=rcap; grandD+=rd; a.g+=rt; a.gc+=rcap; a.gd+=rd;
      const badge=p.type==="tbh"?" <span class='badge tbh'>TBA</span>":p.type==="contractor"?" <span class='badge contractor'>Con</span>":"";
      body+=`<tr><td class="lbl">${p.name}${badge}<div class="muted" style="font-size:11px">${p.role||"—"}</div></td>${tds}${hpCell(rt,rcap,"","col-tot",null,rd)}</tr>`;
    });
  });
  const footRow=(label,a,cls)=>{ let pu=null;
    const tds=a.t.map((t,i)=>{ const cell=hpCell(t,a.c[i],"","",pu,a.d[i]); pu=utilPct(t,a.c[i]); return cell; }).join("");
    return `<tr class="${cls||""}"><td class="lbl">${label}</td>${tds}${hpCell(a.g,a.gc,"","col-tot",null,a.gd)}</tr>`; };
  const foot=`<tfoot>`+
    (acc.employee.n? footRow(`Employees <span class="muted">· ${acc.employee.n}</span>`,acc.employee):"")+
    (acc.contractor.n? footRow(`Contractors <span class="muted">· ${acc.contractor.n}</span>`,acc.contractor):"")+
    (acc.tbh.n? footRow(`To be assigned <span class="muted">· ${acc.tbh.n}</span>`,acc.tbh):"")+

/* ============================ PIVOT: BY ROLE ============================ */
function renderByRole(){
  // group by role, nested under department; demand vs capacity → hiring gap
  const ppl=allPeople().filter(passFilter);
  // role (across ALL practices) -> practice -> people
  const roles={};
  ppl.forEach(p=>{ const r=p.role||"(no title)", d=p.dept||"";
    roles[r]=roles[r]||{}; (roles[r][d]=roles[r][d]||[]).push(p); });
  const colTot=MKEYS.map(()=>0), colCap=MKEYS.map(()=>0), colD=MKEYS.map(()=>0);
  let grand=0, grandCap=0, grandD=0;

  // sum demand+capacity (and demand's $ equivalent) for a set of people in a month
  const sumM=(group,mk)=>{ let dem=0,cap=0,dd=0; group.forEach(p=>{ dem+=personMonthTotal(p.id,mk); cap+=capOf(p,mk); dd+=personMonthDollars(p.id,mk); }); return [dem,cap,dd]; };
  // build a row's month cells + row totals for a group of people
  const rowFor=(group,tally)=>{ let rt=0,rcap=0,rd=0,pu=null;
    const tds=MONTHS.map((m,i)=>{ const [dem,cap,dd]=sumM(group,m.key); rt+=dem; rcap+=cap; rd+=dd;
      if(tally){ colTot[i]+=dem; colCap[i]+=cap; colD[i]+=dd; }
      const cell=hpCell(dem,cap,utilClass(dem,cap),"",pu,dd); pu=utilPct(dem,cap);
      return cell; }).join("");
    return {tds,rt,rcap,rd};
  };

  let body="";
  Object.keys(roles).sort().forEach(r=>{
    const practices=roles[r];
    const rolePeople=Object.values(practices).flat();
    const {tds,rt,rcap,rd}=rowFor(rolePeople,true);   // only level 1 tallies into the footer
    grand+=rt; grandCap+=rcap; grandD+=rd;
    const rOpen=roleOpen.has(r);
    const pracNames=Object.keys(practices).sort((a,b)=>deptRank(a)-deptRank(b)||a.localeCompare(b));
    body+=`<tr class="lvl1${rOpen?" open":""}" data-role="${esc(r)}"><td class="lbl">`+
      `<span class="tw">${chev()}</span><b>${esc(r)}</b>`+
      `<div class="muted" style="font-size:11px;padding-left:18px">${rolePeople.length} ${rolePeople.length===1?"person":"people"} · ${pracNames.length} practice${pracNames.length===1?"":"s"}</div></td>`+
      `${tds}${hpCell(rt,rcap,"","col-tot",null,rd)}</tr>`;
    if(!rOpen) return;

    pracNames.forEach(d=>{
      const grp=practices[d];
      const {tds:dtds,rt:dt,rcap:dcap,rd:ddol}=rowFor(grp,false);
      const key=r+"||"+d, dOpen=rpOpen.has(key);
      body+=`<tr class="lvl2${dOpen?" open":""}" data-rp="${esc(key)}"><td class="lbl lvl2i">`+
        `<span class="tw">${chev()}</span>${esc(deptLabel(d))} <span class="muted">· ${grp.length}</span></td>`+
        `${dtds}${hpCell(dt,dcap,"","col-tot",null,ddol)}</tr>`;
      if(!dOpen) return;

      grp.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{
        const {tds:ptds,rt:pt,rcap:pcap,rd:pd}=rowFor([p],false);
        const badge=p.type==="tbh"?" <span class='badge tbh'>TBA</span>":p.type==="contractor"?" <span class='badge contractor'>Con</span>":"";
        body+=`<tr class="lvl3"><td class="lbl lvl3i">${esc(p.name)}${badge}</td>${ptds}${hpCell(pt,pcap,"","col-tot",null,pd)}</tr>`;
      });
    });
  });
  let fpu=null;
  const foot=`<tfoot><tr class="grand"><td class="lbl">All roles</td>`+
    colTot.map((t,i)=>{ const cell=hpCell(t,colCap[i],"","",fpu,colD[i]); fpu=utilPct(t,colCap[i]); return cell; }).join("")+
    hpCell(grand,grandCap,"","col-tot",null,grandD)+`</tr></tfoot>`;
  document.getElementById("viewRoot").innerHTML=
    `<div class="panel"><div class="panel-hd"><h2>Allocated ${isD()?"dollars":"hours"} by role × month</h2>`+
    `<span class="hint">roles rolled up across all practices · click a role to drill into practices, then into people</span></div>`+
    `<div class="scroll"><table class="pivot">${pivotHead("Role")}<tbody>${body}</tbody>${foot}</table></div>${legend()}</div>`;
}

/* ============================ PIVOT: BY PROJECT ============================ */
/* ---- Allocate by project: project → resources → monthly hours (PRJ first, then CRM) ---- */
function projMonthTotal(projid,mkey){ let t=0; allPeople().forEach(p=>{ t+=alloc(p.id,projid,mkey); }); return t; }
function projMonthDollars(projid,mkey){ let t=0; allPeople().forEach(p=>{ t+=alloc(p.id,projid,mkey)*rateAt(p.id,projid,mkey); }); return t; }
// project-scope display value for the current mode
function projV(projid,mkey){ return isD()? projMonthDollars(projid,mkey) : projMonthTotal(projid,mkey); }
function fmtProj(projid,mkey){ const h=projMonthTotal(projid,mkey); if(!h) return ""; return isD()? money(projMonthDollars(projid,mkey)) : fmt(h); }
/* A project's resources = people with forecast rows (state.alloc) UNION people who
   logged actuals on it. Mirrors personProjects(): actuals live in an overlay, not in
   the plan, so without the union a project whose hours are all actuals showed
   "0 resources" while its month totals (which sum through alloc()) showed the hours. */
function projPeople(projid){
  const pj=String(projid);
  return allPeople().filter(p=>{
    if(state.alloc[p.id] && state.alloc[p.id][projid]!==undefined) return true;
    const ap=ACT_PERSON_PROJ.get(String(p.id)); return !!(ap && ap.has(pj));
  });
}
function byPersonOrder(a,b){ return deptRank(a.dept||"")-deptRank(b.dept||"")||a.name.localeCompare(b.name); }

function renderByProj(){
  const q=(F.search||"").toLowerCase();
  const projs=sortedProjects().filter(pr=> !q || projLabel(pr).toLowerCase().includes(q) || (pr.client||"").toLowerCase().includes(q));
  LAST_PROJ_LIST=projs;
  const nPrj=projs.filter(p=>p.src==="PRJ").length, nCrm=projs.length-nPrj;
  let html=`<div class="panel"><div class="panel-hd">`+
    `<div style="display:flex;align-items:center;gap:12px"><h2>Allocate by project</h2>`+
    `<button class="btn" id="btnBulk" style="padding:5px 11px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Bulk allocate</button></div>`+
    `<span class="hint">${nPrj} PRJ (Odoo) · ${nCrm} CRM (pipeline) · click a project to add resources and allocate hours</span></div>`+
    `<div class="scroll"><div style="min-width:900px">`;
  html+=`<div style="display:grid;grid-template-columns:var(--namecol) 1fr;position:sticky;top:0;z-index:5">`+
    `<div class="p-ident" style="background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;align-items:center">Project · client</div>`+
    monthHeadRow()+`</div>`;
  if(!projs.length) html+=`<div class="empty-body" style="padding:24px">No projects match the search.</div>`;
  projs.forEach(pr=>{ html+=projectRow(pr); });
  if(projs.length){ const t=projTotals(projs); html+=totalsRowHtml(`Total · ${projs.length} projects`, t.perMonth, t.grand); }
  html+=`</div></div></div>`;
  document.getElementById("viewRoot").innerHTML=html;
}
function projectRow(pr){
  const id=String(pr.id), isOpen=projOpen.has(id), people=projPeople(pr.id);
  const cells=MONTHS.map(m=>{ const h=projMonthTotal(pr.id,m.key);
    return `<div class="mcell" data-psum="${id}:${m.key}"><span class="h">${h?fmtProj(pr.id,m.key):"·"}</span></div>`;
  }).join("");
  const yr=MKEYS.reduce((s,k)=>s+projMonthTotal(pr.id,k),0);
  const yrD=MKEYS.reduce((s,k)=>s+projMonthDollars(pr.id,k),0);
  const badge=pr.src==="CRM"?`<span class="badge crm">CRM</span>`:`<span class="badge prj">PRJ</span>`;
  return `<div class="p-row ${isOpen?"open":""}">`+
    `<div class="p-head">`+
      `<div class="p-ident" data-ptoggle="${id}">`+
        `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>`+
        `<div style="min-width:0"><div class="p-name" title="${esc(pr.name)}${pr.client?" · "+esc(pr.client):""}${pr.src==="CRM"&&pr.stage?" · "+esc(pr.stage):""}">${badge} ${esc(pr.name)}${npBadge(pr)}${mmBadge(pr)}</div>`+

/* ============================ HIRING / TBH ============================ */
function detectGaps(){
  // for each role, find months where demand>capacity for >=1 month; report peak shortfall
  const gaps=[];
  const roleMap={};
  allPeople().forEach(p=>{ const key=deptLabel(p.dept)+" · "+(p.role||"(no title)"); (roleMap[key]=roleMap[key]||[]).push(p); });
  Object.keys(roleMap).forEach(key=>{
    const grp=roleMap[key]; let peak=0, peakMonth=null, monthsOver=0;
    MKEYS.forEach((k,i)=>{ let dem=0,cap=0; grp.forEach(p=>{dem+=personMonthTotal(p.id,k);cap+=capOf(p,k);});
      const sh=dem-cap; if(sh>0){ monthsOver++; if(sh>peak){peak=sh;peakMonth=MONTHS[i].label;} } });
    if(peak>0) gaps.push({role:key,peak,peakMonth,monthsOver});
  });
  return gaps.sort((a,b)=>b.peak-a.peak);
}

/* ==================== PIVOT: FORECAST vs ACTUAL VARIANCE ==================== */
/* Closed months only — a month you can compare needs BOTH a forecast (retained in
   the plan) and actuals (synced from Odoo). The current month is still open, so it
   is excluded until it closes. */
const CLOSED_MONTHS = MONTHS.filter(m=>isPastMi(m.mi));
/* The current month appears too, as a month-to-date column: actuals synced so far
   vs the full-month forecast. Shown neutrally (a half-elapsed month judged against
   a whole month's forecast would false-alarm) and kept OUT of the summary totals. */
const MTD_MONTH = CURRENT_MI<12 ? MONTHS[CURRENT_MI] : null;
const VAR_MONTHS = MTD_MONTH ? CLOSED_MONTHS.concat([MTD_MONTH]) : CLOSED_MONTHS;
const isMTD = (m)=> MTD_MONTH && m.key===MTD_MONTH.key;
/* Read forecast and actual RAW, not through alloc(): alloc() hides the plan behind
   actuals for past months, but variance needs the plan value that was forecast for
   that month (retained even after the month closed) alongside the actual. */
function personForecastMonth(pid,mkey){
  const a=state.alloc[pid]; if(!a) return 0;
  let t=0; for(const proj in a){ const v=a[proj][mkey]; if(v) t+=v; } return t;
}
function personActualMonth(pid,mkey){
  const set=ACT_PERSON_PROJ.get(String(pid)); if(!set) return 0;
  let t=0; set.forEach(proj=>{ t+=ACTUALS.get(`${pid}|${proj}|${mkey}`)||0; }); return t;
}
/* Variance cell: actual on top, (actual − forecast) beneath. Green when the forecast
   was accurate (within 5%, or 8h — 5% of a full 160h month), amber when actual
   overran the plan, blue when it fell short, muted when neither number exists. */
function varClass(f,a){
  if(!f && !a) return "v-zero";
  const d=a-f;
  if(f && Math.abs(d) <= Math.max(8, f*0.05)) return "v-on";
  return d>0 ? "v-over" : "v-under";
}
function varCell(f,a,extra){
  const d=a-f, cls=varClass(f,a);
  const pct = f ? Math.round(d/f*100) : null;
  const sub = (f||a)
    ? `<span class="pct">${d>0?"+":""}${fmt(d)}h${pct!=null?` · ${d>0?"+":""}${pct}%`:""}</span>`
    : "";
  const tip = `Forecast ${fmt0(f)}h · Actual ${fmt0(a)}h · Variance ${d>0?"+":""}${fmt0(d)}h`;
  const main = (f||a) ? fmt(a) : "·";
  return `<td class="mcelln ${cls}${extra?" "+extra:""}" title="${tip}"><span class="h">${main}</span>${sub}</td>`;
}
function varTotCell(f,a,extra){
  const d=a-f;
  return `<td class="mcelln ${varClass(f,a)}${extra?" "+extra:""}"><span class="h">${d>0?"+":""}${fmt(d)}</span></td>`;
}
/* Month-to-date cell: actuals so far this month next to the full-month forecast.
   Neutral (no shading) — the month isn't over, so under-plan is expected. */
function mtdCell(f,a){
  const d=a-f;
  const sub=(f||a)?`<span class="pct">${d>0?"+":""}${fmt(d)}h${f?` · ${d>0?"+":""}${Math.round(d/f*100)}%`:""}</span>`:"";
  return `<td class="mcelln mtd" title="Month to date — actuals synced so far vs the full-month forecast"><span class="h">${a?fmt(a):"·"}</span>${sub}</td>`;
}
function renderVariance(){
  if(!VAR_MONTHS.length){
    document.getElementById("viewRoot").innerHTML=
      `<div class="panel"><div class="panel-hd"><h2>Forecast vs actual</h2></div>`+
      `<div class="empty-body" style="padding:28px">No closed months yet. Variance appears once a month completes and its Odoo actuals are synced.</div></div>`;
    return;
  }
  // Real people only (to-be-hired pools have no actuals to compare against), and
  // only those with something to show in the covered months.
  const ppl=filteredPeople().filter(p=>p.type!=="tbh").filter(p=>
    VAR_MONTHS.some(m=> personForecastMonth(p.id,m.key) || personActualMonth(p.id,m.key)));
  const head=`<thead><tr class="mhd"><th class="lbl" rowspan="2">Person</th>`+
    VAR_MONTHS.map(m=>`<th class="actual mgrp" colspan="2">${m.label}${isMTD(m)?" · MTD":""}</th>`).join("")+
    `<th class="col-tot mgrp" rowspan="2">Forecast</th><th class="col-tot" rowspan="2">Actual</th><th class="col-tot" rowspan="2">Variance</th><th class="col-tot" rowspan="2">Var %</th></tr>`+
    `<tr class="subhd">`+VAR_MONTHS.map(()=>`<th class="actual mgrp">Fcst</th><th class="actual">Act</th>`).join("")+`</tr></thead>`;
  const byDept={}; ppl.forEach(p=>{ const d=p.dept||""; (byDept[d]=byDept[d]||[]).push(p); });
  const mkAcc=()=>({f:0,a:0,n:0, mf:VAR_MONTHS.map(()=>0), ma:VAR_MONTHS.map(()=>0)});
  const acc={employee:mkAcc(), contractor:mkAcc()};
  const colF=VAR_MONTHS.map(()=>0), colA=VAR_MONTHS.map(()=>0);
  let body="";
  deptsInOrder(ppl).forEach(d=>{ if(!byDept[d]) return;
    body+=`<tr class="grp"><td class="lbl">${deptLabel(d)}</td>`+VAR_MONTHS.map(()=>`<td class="fcst"></td><td></td>`).join("")+`<td class="col-tot fcst"></td><td class="col-tot"></td><td class="col-tot"></td><td class="col-tot"></td></tr>`;
    byDept[d].forEach(p=>{
      let rf=0, ra=0;
      const A=acc[p.type]||acc.employee;
      const tds=VAR_MONTHS.map((m,i)=>{ const f=personForecastMonth(p.id,m.key), a=personActualMonth(p.id,m.key);
        colF[i]+=f; colA[i]+=a; A.mf[i]+=f; A.ma[i]+=a;
        // the open month is display-only: it never counts toward the summary totals
        if(!isMTD(m)){ rf+=f; ra+=a; }
        return `<td class="mcelln fcst"><span class="h">${f?fmt(f):"·"}</span></td>`+(isMTD(m)? mtdCell(f,a) : varCell(f,a)); }).join("");
      A.f+=rf; A.a+=ra; A.n++;
      const badge=p.type==="contractor"?" <span class='badge contractor'>Con</span>":"";
      const vpct = rf? `${ra-rf>0?"+":""}${Math.round((ra-rf)/rf*100)}%` : (ra?"—":"");
      body+=`<tr><td class="lbl">${esc(p.name)}${badge}<div class="muted" style="font-size:11px">${esc(p.role||"—")}</div></td>${tds}`+
        `<td class="mcelln col-tot fcst"><span class="h">${fmt(rf)}</span></td>`+
        `<td class="mcelln col-tot"><span class="h">${fmt(ra)}</span></td>`+
        varTotCell(rf,ra,"col-tot")+
        `<td class="mcelln col-tot ${varClass(rf,ra)}"><span class="h">${vpct}</span></td></tr>`;
    });
  });
  const footRow=(label,f,a,cls,mf,ma)=>{
    const vpct = f? `${a-f>0?"+":""}${Math.round((a-f)/f*100)}%` : (a?"—":"");
    // per-month tallies: forecast total plain, actual total with the same
    // delta/% and shading the person cells use
    const mtds=VAR_MONTHS.map((m,i)=>
      `<td class="mcelln fcst"><span class="h">${mf[i]?fmt(mf[i]):"·"}</span></td>`+(isMTD(m)? mtdCell(mf[i],ma[i]) : varCell(mf[i],ma[i]))).join("");
    return `<tr class="${cls||""}"><td class="lbl">${label}</td>${mtds}`+
      `<td class="mcelln col-tot fcst"><span class="h">${fmt(f)}</span></td>`+
      `<td class="mcelln col-tot"><span class="h">${fmt(a)}</span></td>`+
      varTotCell(f,a,"col-tot")+
      `<td class="mcelln col-tot ${varClass(f,a)}"><span class="h">${vpct}</span></td></tr>`;
  };
  // summary totals cover closed months only — the MTD column is display-only
  const totF=VAR_MONTHS.reduce((s,m,i)=>s+(isMTD(m)?0:colF[i]),0), totA=VAR_MONTHS.reduce((s,m,i)=>s+(isMTD(m)?0:colA[i]),0);
  const foot=`<tfoot>`+
    (acc.employee.n? footRow(`Employees <span class="muted">· ${acc.employee.n}</span>`,acc.employee.f,acc.employee.a,"",acc.employee.mf,acc.employee.ma):"")+
    (acc.contractor.n? footRow(`Contractors <span class="muted">· ${acc.contractor.n}</span>`,acc.contractor.f,acc.contractor.a,"",acc.contractor.mf,acc.contractor.ma):"")+
    footRow("All shown",totF,totA,"grand",colF,colA)+`</tfoot>`;
  const range=CLOSED_MONTHS.length? CLOSED_MONTHS[0].label+"–"+CLOSED_MONTHS[CLOSED_MONTHS.length-1].label : "none closed yet";
  document.getElementById("viewRoot").innerHTML=
    `<div class="panel"><div class="panel-hd"><h2>Forecast vs actual variance</h2>`+
    `<span class="hint">closed months (${range})${MTD_MONTH?` + <b>${MTD_MONTH.label} month-to-date</b> (neutral, excluded from totals)`:""} · <b>Fcst</b> = retained forecast · <b>Act</b> = Odoo actual with actual − forecast beneath · ${ppl.length} people</span></div>`+
    `<div class="scroll"><table class="pivot">${head}<tbody>${body}</tbody>${foot}</table></div>`+
    `<div class="legend"><span>Variance = Actual − Forecast</span>`+
    `<span class="sw"><span class="box v-on"></span>on plan (±5%)</span>`+
    `<span class="sw"><span class="box v-over"></span>over plan (actual &gt; forecast)</span>`+
    `<span class="sw"><span class="box v-under"></span>under plan (actual &lt; forecast)</span></div></div>`;
}

/* ==================== CRM MISMATCHES (forecast vs CRM window) ==================== */
function renderCrmCheck(){
  const q=(F.search||"").toLowerCase();
  const rows=CRM_PROJECTS
    .map(pr=>({pr,m:crmMismatch(pr)}))
    .filter(x=>x.m)
    .filter(x=> !q || x.pr.name.toLowerCase().includes(q) || (x.pr.client||"").toLowerCase().includes(q))
    .sort((a,b)=> a.pr.name.localeCompare(b.pr.name));
  const flagCell=m=>{
    let b="";
    if(m.missingFlag) b+=`<span class="badge np" style="margin-right:4px">missing forecast</span>`;
    if(m.startFlag) b+=`<span class="badge np" style="margin-right:4px">start</span>`;
    if(m.lenFlag) b+=`<span class="badge np">length</span>`;
    return b;
  };
  const body=rows.map(({pr,m})=>`<tr>`+
    `<td class="lbl"><span class="badge crm">CRM</span> ${esc(pr.name)}<div class="muted" style="font-size:11px">${esc(pr.client||"—")}${pr.stage?" · "+esc(pr.stage):""}</div></td>`+
    `<td style="text-align:left">${flagCell(m)}</td>`+
    `<td class="mcelln">${m.expStart?esc(m.expStart):"—"}</td>`+
    `<td class="mcelln">${m.visStart?monLabel(m.visStart):"—"}</td>`+
    `<td class="mcelln ${m.startFlag||m.missingFlag?"v-over":""}">${m.fStart?monLabel(m.fStart):"—"}</td>`+
    `<td class="mcelln">${m.expMonths||"—"}</td>`+
    `<td class="mcelln">${m.visLen==null?"—":m.visLen}</td>`+
    `<td class="mcelln ${m.lenFlag||m.missingFlag?"v-over":""}">${m.fLen||"—"}</td>`+
    `<td class="mcelln col-tot">${m.fHours?fmt0(m.fHours):"—"}</td>`+
  `</tr>`).join("");
  document.getElementById("viewRoot").innerHTML=
    `<div class="panel"><div class="panel-hd"><h2>CRM mismatches — forecast vs opportunity window</h2>`+
    `<span class="hint">${rows.length} flagged · start = forecast begins in a different month than the CRM expected start · length = months with forecast hours ≠ CRM projected months (both clipped to CY${String(YEAR).slice(2)}) · missing forecast = Propose/Negotiate with nothing staffed</span></div>`+
    (rows.length?
      `<div class="scroll"><table class="pivot"><thead><tr><th class="lbl">Opportunity</th><th style="text-align:left">Flags</th>`+
      `<th>CRM start</th><th>Expected start (CY${String(YEAR).slice(2)})</th><th>Forecast start</th>`+
      `<th>CRM months</th><th>Expected (CY${String(YEAR).slice(2)})</th><th>Forecast months</th><th class="col-tot">Forecast hrs</th></tr></thead>`+
      `<tbody>${body}</tbody></table></div>`+
      `<div class="legend"><span>Window checks skip opportunities with no CRM start date / projected months. Unstaffed opportunities are only flagged from Propose/Negotiate onward.</span></div>`
      :`<div class="empty-body" style="padding:28px">No mismatches — every forecast on a CRM opportunity agrees with its expected start date and projected length, and every Propose/Negotiate opportunity has a forecast${CRM_PROJECTS.some(p=>p.expectedStart)?"":" (CRM planning fields not synced yet — run Sync Odoo)"}.</div>`)+
    `</div>`;
}

/* ============================ ROUTER ============================ */
function render(){
  renderBanner();
  renderKpis();
  const showFilters = VIEW!=="hiring";
  document.getElementById("filters").style.visibility = showFilters? "visible":"hidden";
  const personFilters = VIEW!=="byProj" && VIEW!=="byCust" && VIEW!=="crmCheck";   // these views search projects/customers, not people
  document.getElementById("fDept").style.display = personFilters? "":"none";
  document.getElementById("fType").style.display = personFilters? "":"none";
  document.getElementById("fSearch").placeholder = personFilters ? "Search name / role…"
    : (VIEW==="byCust" ? "Search customer / project…" : "Search project / client…");
  if(VIEW==="allocate") renderAllocate();
  else if(VIEW==="byEmp") renderByEmp();
  else if(VIEW==="byRole") renderByRole();
  else if(VIEW==="byProj") renderByProj();
  else if(VIEW==="byCust") renderByCust();
  else if(VIEW==="variance") renderVariance();

  else if(VIEW==="hiring") renderHiring();
}
function setView(v){ VIEW=v;

}

document.getElementById("viewRoot").addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.a){ const [pid,projid,mkey]=el.dataset.a.split("|");
    if(!canEdit()){ el.value = alloc(pid,projid,mkey) || ""; return; }   // viewers cannot change anything
    let v=parseFloat(el.value); if(isNaN(v)||v<0) v=0;
    setAlloc(pid,projid,mkey,v); refreshRowTotal(pid,projid); refreshPersonSummary(pid); refreshProjSummary(projid); renderKpis();
    queuePush(pid,projid,mkey,v);   // debounced: typing "120" is one write, not three
  }
});
/* Per-cell debounce so each keystroke doesn't become a round-trip. */
const pushTimers={};
function queuePush(pid,projid,mkey,v){
  const k=verKey(pid,projid,mkey);
  clearTimeout(pushTimers[k]);
  status("Saving…");
  pushTimers[k]=setTimeout(()=>{ delete pushTimers[k]; pushAllocation(pid,projid,mkey,v); }, 500);
}
document.getElementById("viewRoot").addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.cap!==undefined){ const pid=el.dataset.cap;
    if(!canEdit()) return;
    const val = (el.value===""||el.value===null) ? null : Number(el.value);
    if(val==null) delete state.capacity[pid]; else state.capacity[pid]=val;
    refreshPersonSummary(pid); renderKpis();
    api("PUT","/api/capacity",{resourceKey:resKey(pid),hoursPerMonth:val,version:capVer[pid]||0})
      .then(r=>{ if(r.deleted) delete capVer[pid]; else capVer[pid]=r.version; status("Saved"); })
      .catch(e=>{ toast("Capacity not saved: "+e.message); });
  }
  if(el.dataset.prate!==undefined){ const [pid,projid]=el.dataset.prate.split("|");
    if(!canEdit()){ el.value = pairRate(pid,projid) || ""; return; }
    const r = (el.value===""||el.value===null) ? 0 : Math.max(0,Number(el.value)||0);
    setPairRateLocal(pid,projid,r);
    refreshPairRate(pid,projid);
    pushRate(pid,projid,r);
  }
  if(el.dataset.proposed!==undefined){ const [pid,projid]=el.dataset.proposed.split("|");
    if(!canEdit()){ el.value=proposedFor(pid,projid); return; }
    const name=el.value.trim();
    if(name) state.proposed[`${pid}|${projid}`]=name; else delete state.proposed[`${pid}|${projid}`];
    api("PUT","/api/proposed",{resourceKey:resKey(pid),targetKey:tgtKey(projid),name})
      .then(()=>status("Saved")).catch(err=>toast("Proposed hire not saved: "+err.message));
    return;
  }
  if(el.dataset.tbadept!==undefined){ const t=state.tbh.find(x=>String(x.id)===String(el.dataset.tbadept));
    if(!t) return;
    if(!canEdit()){ el.value=t.dept||""; return; }
    const dept=el.value;
    api("PUT","/api/tbh",{ tbhKey:String(t.id).replace(/^tbh-/,""), name:t.name, role:t.role, dept, shore:t.shore, start:t.start, cap:t.cap })
      .then(()=>{ t.dept=dept; status("Saved"); toast(dept?`${t.name} → ${dept}`:`${t.name} → no department`);
        refreshDeptFilter(); keepScroll(renderHiring); renderKpis(); })
      .catch(err=>{ el.value=t.dept||""; toast("Department not saved: "+err.message); });
    return;
  }
  if(el.dataset.transfer!==undefined && el.value){ const [tid,proj]=el.dataset.transfer.split("|"); const eid=el.value;
    if(!canEdit()){ el.value=""; return; }
    // Opens the transfer dialog with this person preselected, so the amount can
    // be trimmed for a partial handover; amounts default to everything.
    el.value="";
    openTransferModal(tid, proj, eid);
    return;
  }
  if(el.dataset.addproj!==undefined && el.value){ const pid=el.dataset.addproj, projid=el.value;
    if(!state.alloc[pid]) state.alloc[pid]={}; if(!state.alloc[pid][projid]) state.alloc[pid][projid]={};
    /*saved via API*/ keepScroll(renderAllocate); // keep this person open, stay where we were
  }
  if(el.dataset.addres!==undefined && el.value){ const projid=el.dataset.addres, pid=el.value;
    if(!state.alloc[pid]) state.alloc[pid]={}; if(!state.alloc[pid][projid]) state.alloc[pid][projid]={};
    /*saved via API*/ keepScroll(renderByProj); // keep this project open, stay where we were
  }
});
/* Re-rendering a grid replaces its .scroll container, which silently resets the
   scroll position — so expanding a row deep in the list snapped the view back to
   the top. Capture the container's scroll offsets and restore them after. */
function keepScroll(fn){
  const sc=document.querySelector("#viewRoot .scroll");
  const t=sc?sc.scrollTop:0, l=sc?sc.scrollLeft:0;
  fn();
  const sc2=document.querySelector("#viewRoot .scroll");
  if(sc2){ sc2.scrollTop=t; sc2.scrollLeft=l; }
}
document.getElementById("viewRoot").addEventListener("click",e=>{
  if(e.target.closest("#btnBulk")){ openBulkModal(); return; }
  const rp=e.target.closest("[data-rp]");            // By Role: practice → people
  if(rp){ const k=rp.getAttribute("data-rp"); if(rpOpen.has(k)) rpOpen.delete(k); else rpOpen.add(k); keepScroll(renderByRole); return; }
  const rr=e.target.closest("[data-role]");          // By Role: role → practices
  if(rr){ const k=rr.getAttribute("data-role"); if(roleOpen.has(k)) roleOpen.delete(k); else roleOpen.add(k); keepScroll(renderByRole); return; }
  const cu=e.target.closest("[data-cust]");          // By Customer: customer → projects/CRM
  if(cu){ const k=cu.getAttribute("data-cust"); if(custOpen.has(k)) custOpen.delete(k); else custOpen.add(k); keepScroll(renderByCust); return; }
  const ptog=e.target.closest("[data-ptoggle]");   // By Project: expand a project
  if(ptog){ const id=ptog.dataset.ptoggle; if(projOpen.has(id)) projOpen.delete(id); else projOpen.add(id); keepScroll(renderByProj); return; }
  const rmr=e.target.closest("[data-rmres]");      // By Project: remove a resource from a project
  if(rmr){ const [pid,projid]=rmr.dataset.rmres.split("|"); if(state.alloc[pid]) delete state.alloc[pid][projid];
    if(pairRate(pid,projid)){ setPairRateLocal(pid,projid,0); pushRate(pid,projid,0); }
    /*saved via API*/ keepScroll(renderByProj); renderKpis(); return; }
  const xf=e.target.closest("[data-xfer]");        // Allocate tabs: transfer all/partial hours to another resource
  if(xf){ if(!canEdit()) return; const s=xf.dataset.xfer, i=s.indexOf("|"); openTransferModal(s.slice(0,i), s.slice(i+1)); return; }
  const mo=e.target.closest("[data-mapopp]");      // By Project: map a closed CRM opp's forecast onto a project
  if(mo){ const oppId=mo.dataset.mapopp; const sel=document.querySelector(`[data-mapsel="${oppId}"]`);
    const projectId=sel&&sel.value; if(!projectId){ toast("Choose a project to map to."); return; }
    mapOppToProject(oppId,projectId); return; }
  const tog=e.target.closest("[data-toggle]");
  if(tog){ const id=tog.dataset.toggle; if(openSet.has(id)) openSet.delete(id); else openSet.add(id); keepScroll(renderAllocate); return; }
  const rm=e.target.closest("[data-rmproj]");
  if(rm){ const [pid,projid]=rm.dataset.rmproj.split("|"); if(state.alloc[pid]) delete state.alloc[pid][projid];
    if(pairRate(pid,projid)){ setPairRateLocal(pid,projid,0); pushRate(pid,projid,0); }
    /*saved via API*/ keepScroll(renderAllocate); renderKpis(); return; }
  const smv=e.target.closest("[data-shoremv]");   // To Be Assigned: move one project to the other-shore pool
  if(smv){ if(!canEdit()) return;
    const [tid,proj]=smv.dataset.shoremv.split("|"); const shore=smv.dataset.shoreto;
    smv.disabled=true; smv.textContent="Moving…";
    api("POST","/api/tbh/move",{tbhKey:String(tid).replace(/^tbh-/,""),targetKey:tgtKey(proj),shore})
      .then(r=>{ toast(`Moved ${r.moved} month${r.moved===1?"":"s"} to the ${shore} pool${r.merged?` (${r.merged} merged)`:""}.`); tbaOpen.add("tbh-"+r.destKey); return bootstrap(); })
      .catch(err=>{ toast("Move failed: "+err.message); smv.disabled=false; });
    return; }
  const tba=e.target.closest("[data-tbaopen]");   // To Be Assigned: drill into a role pool
  if(tba){ const id=String(tba.dataset.tbaopen); if(tbaOpen.has(id)) tbaOpen.delete(id); else tbaOpen.add(id); renderHiring(); return; }
  const sh=e.target.closest("[data-shifttbh]");   // move a role pool's forecast to the assigned person
  if(sh){ if(!canEdit()) return; openShiftModal(sh.dataset.shifttbh); return; }
  const del=e.target.closest("[data-deltbh]");
  if(del){ const id=del.dataset.deltbh;
    state.tbh=state.tbh.filter(t=>String(t.id)!==String(id)); delete state.alloc[id]; delete state.capacity[id]; openSet.delete(String(id)); render();
    api("DELETE","/api/tbh/"+encodeURIComponent(String(id).replace(/^tbh-?/,"")))
      .then(()=>status("Saved")).catch(e=>toast("Open role not removed: "+e.message));
    return; }
  const pf=e.target.closest("[data-prefill]");
  if(pf){ const parts=decodeURIComponent(pf.dataset.prefill).split(" · "); openTbhForm(parts[1]||"",parts[0]||""); return; }
  if(e.target.id==="tbhAdd"){ addTbh(); return; }
});
async function mapOppToProject(oppId,projectId){
  if(!canEdit()) return;
  try{
    status("Mapping…");
    const r=await api("POST","/api/opportunity/map",{oppId:Number(oppId),projectId:Number(projectId)});
    toast(`Forecast moved to the project${r&&r.merged?` (${r.merged} month${r.merged>1?"s":""} merged)`:""}.`);
